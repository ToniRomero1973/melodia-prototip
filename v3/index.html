<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E8%90%AC%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --surface:#FFFFFF; --ink:#1F2328; --quiet:#5B5F66; --line:#E6DDCD;
  --jade:#1F6F5C; --jade-d:#164F41; --jade-soft:#E2EFE9; --gold:#E9B949; --gold-d:#B8862B; --warn:#B5562F;
  --tw:50px; --th:66px; --gap:2px; --sym:34px;
  --serif:"Fraunces", Georgia, serif;
  --cjk:"Noto Serif TC","Songti SC","SimSun",serif;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.dark{ --bg:#191C1F; --surface:#24282C; --ink:#F1EEE8; --quiet:#B4B0A8; --line:#353A40; --jade-soft:#1F3A33; }
.size-gran{ --tw:55px; --th:72px; --sym:38px; }
.size-mgran{ --tw:58px; --th:76px; --sym:41px; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#CFC8BA}
body{display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink)}
button{font:inherit;color:inherit}
.phone{width:100%;max-width:400px;height:100%;max-height:860px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){ .phone{border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.3);border:10px solid #161616;height:860px} }
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;overflow-y:auto;padding:18px 20px 16px}
h1{font-family:var(--serif);font-size:30px;margin:4px 0;letter-spacing:-.3px} h2{font-family:var(--serif);font-size:23px;margin:18px 0 10px}
p{line-height:1.45;margin:6px 0} .muted{color:var(--quiet)}
.btn{font-size:18px;font-weight:700;border:0;border-radius:999px;min-height:54px;padding:0 22px;cursor:pointer;width:100%;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--jade);color:#fff;box-shadow:0 4px 0 var(--jade-d)}
.btn.gold{background:linear-gradient(180deg,#F6D06B,#E3AE3B);color:#3A2A08;box-shadow:0 4px 0 #A97A1E, 0 8px 18px rgba(0,0,0,.25)}
.btn.secondary{background:transparent;border:2px solid var(--line)}
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-block;background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.dark .pill{color:#9FD6C4}
/* ---------- tabs ---------- */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;font-size:13px;background:none;border:0;color:var(--quiet);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--jade);font-weight:700} .dark .tabs button.on{color:#9FD6C4}
/* ---------- fitxa ---------- */
.tile{position:absolute;width:var(--tw);height:var(--th);padding:0;border:0;background:none;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), filter .3s ease}
.tile::before{content:"";position:absolute;inset:0;border-radius:9px;transform:translate(3px,5px);
  background:linear-gradient(140deg,#2F9474 0%,#1C6550 55%,#134536 100%);box-shadow:2px 5px 9px rgba(0,0,0,.42)}
.face{position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(155deg,#FFFEFA 0%,#F7F0E2 55%,#ECE1CB 100%);
  box-shadow:inset 0 0 0 1px rgba(110,90,60,.22), inset 0 2px 0 #fff, inset 0 -3px 6px rgba(160,130,90,.15), 1.5px 2.5px 0 #DCCDB0}
.face svg{width:86%;height:86%;overflow:visible}
.face .emo{font-size:var(--sym);line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.tile.blocked{filter:brightness(.66) saturate(.7)}
.hc .tile.blocked .face::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 3px,transparent 3px 9px)}
.tile.sel{transform:translate(-1px,-8px)}
.tile.hint .face{animation:hintp .6s ease-in-out 0s 2 alternate, hintg 2.2s ease-out}
@keyframes hintp{to{transform:translateY(-7px) scale(1.06)}}
@keyframes hintg{0%,70%{box-shadow:0 0 0 4px var(--gold),0 0 24px rgba(246,200,90,.95)}100%{box-shadow:none}}
.slot.hintslot{animation:hints 1s ease-in-out 2}
@keyframes hints{50%{border-color:var(--gold);box-shadow:0 0 0 4px rgba(246,200,90,.6)}}
.hintbtn{display:flex;align-items:center;gap:4px;border:0;border-radius:11px;padding:0 10px;height:36px;background:var(--gchip,rgba(255,255,255,.12));color:var(--gink,inherit);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.hintbtn svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){ .tile.hint .face{animation:hintg 2.2s ease-out} .slot.hintslot{animation:none;border-color:var(--gold)} }
.tile.sel .face{box-shadow:inset 0 0 0 1px rgba(110,90,60,.22), 1.5px 2.5px 0 #DCCDB0, 0 0 0 3px var(--gold), 0 0 22px rgba(246,200,90,.9)}
@media (hover:hover){ .tile:not(.blocked):not(.sel):hover{transform:translateY(-3px)} }
.tile.gone{display:none}
.tile.shake{animation:shake .22s}
@keyframes shake{20%{translate:-4px 0}60%{translate:4px 0}}
/* ---------- joc ---------- */
.felt{background:radial-gradient(ellipse 120% 80% at 50% 38%,#2F7F65 0%,#215C4B 50%,#173F34 100%);color:#F4EEDF;position:relative}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:3px 3px,5px 5px;background-position:0 0,1px 2px}
.topbar{height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;position:relative;z-index:2}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.topbar .title{flex:1;font-weight:700;font-size:16px;line-height:1.15}
.topbar .title small{display:block;font-weight:400;opacity:.75;font-size:13px}
.chip{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;white-space:nowrap}
.staff{height:44px;margin:0 14px;position:relative;z-index:2}
.staff svg{width:100%;height:100%}
.staff .n{fill:rgba(255,255,255,.22);transform-box:fill-box;transform-origin:center;transition:fill .3s}
.staff .n.on{fill:var(--gold);animation:pop .45s cubic-bezier(.34,1.8,.64,1)}
.staff .n.play{fill:#fff;animation:pop .3s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.8)}100%{transform:scale(1)}}
.boardwrap{flex:1;overflow:auto;display:flex;padding:8px 4px 14px;position:relative;z-index:1;isolation:isolate}
.board{position:relative;margin:auto;flex:none;touch-action:none}
.tile,.slot{touch-action:none;-webkit-user-select:none;user-select:none}
.tray{position:relative;z-index:2;padding:12px 14px 14px;background:linear-gradient(180deg,#A2724B 0%,#875A37 45%,#6B4429 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 6px rgba(0,0,0,.3), 0 -6px 16px rgba(0,0,0,.25)}
.tray::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 7px,rgba(255,255,255,.12) 7px 8px,transparent 8px 13px)}
.slots{display:flex;gap:12px;justify-content:center;position:relative}
.slot{width:calc(var(--tw) + 8px);height:calc(var(--th) + 10px);border-radius:12px;border:0;padding:0;cursor:pointer;position:relative;
  background:rgba(40,22,10,.45);box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.15)}
.slot .tile{left:3px;top:2px}
.slot.warnpulse{animation:warnp 1.2s ease-in-out infinite}
@keyframes warnp{50%{box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 0 0 2px rgba(255,170,120,.7)}}
.trayinfo{display:flex;justify-content:space-between;font-size:14px;color:#F6E7D2;margin-top:10px;position:relative}
.trayinfo .w{color:#FFD2B8;font-weight:700}
.left .slots{flex-direction:row-reverse} .left .topbar{flex-direction:row-reverse}
/* ---------- faristol ---------- */
.stand{position:relative;z-index:2;padding:10px 16px 14px;background:linear-gradient(180deg,#22302B 0%,#18221F 100%);box-shadow:0 -8px 20px rgba(0,0,0,.28)}
.stand::after{content:"";position:absolute;left:50%;bottom:0;width:6px;height:12px;margin-left:-3px;background:#B8862B;border-radius:3px 3px 0 0;opacity:.7}
.standlabel{display:flex;align-items:center;gap:6px;justify-content:center;color:#E9D7A6;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.standlabel svg{width:16px;height:16px}
.stand .slots{gap:18px;padding-bottom:8px;border-bottom:3px solid #B8862B;border-radius:2px}
.stand .slot{background:rgba(255,255,255,.05);box-shadow:inset 0 2px 8px rgba(0,0,0,.55);border:1.5px dashed rgba(233,215,166,.35)}
.slot.target,.tile.target .face{outline:3px solid var(--gold);outline-offset:2px}
.tile.target{transform:scale(1.08)}
.slot.target{background:rgba(233,185,73,.18)}
#fx .tile.drag{z-index:50;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
.flynote{position:absolute;font-family:var(--serif);font-weight:700;font-size:22px;color:#FFE7A0;text-shadow:0 0 10px rgba(246,200,90,.9)}
.staff{display:flex;align-items:center;gap:6px}
.staff svg{flex:1}
.staffq{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:#FFE7A0;flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:2px solid var(--line);border-radius:16px;background:transparent;padding:8px 14px;text-align:left;cursor:pointer}
.opt small{display:block;color:var(--quiet);font-size:14px}
.opt.ok{border-color:#1F7A4D;background:#E3F2EA} .opt.bad{border-color:#B8322A;background:#FBE9E7}
.dark .opt.ok{background:#1F3A2C} .dark .opt.bad{background:#3A1F1F}
.disc{width:120px;height:120px;margin:4px auto 8px;border-radius:50%;background:radial-gradient(circle,#E9B949 0 14%,#1a1a1a 15% 17%,#2a2a2a 18% 30%,#1a1a1a 31% 33%,#2c2c2c 34% 48%,#1a1a1a 49% 51%,#262626 52% 100%);box-shadow:0 8px 20px rgba(0,0,0,.3);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- panell de frase ---------- */
.panel{margin:0 12px 2px;padding:8px 10px;border-radius:16px;background:rgba(0,0,0,.22);position:relative;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 11px}
.word{display:inline-flex;gap:2px}
.lc{width:16px;height:22px;border-radius:4px;background:rgba(255,255,255,.12);border-bottom:2px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#1F2328}
.lc.on{background:linear-gradient(160deg,#FFFDF7,#EFE5D0);border-bottom-color:#C9B994;animation:flip .45s cubic-bezier(.3,1.5,.6,1)}
.lc.win{background:linear-gradient(160deg,#FFE7A0,#E9B949);border-bottom-color:#B8862B}
@keyframes flip{0%{transform:rotateX(90deg) scale(1.3)}100%{transform:none}}
.punct{color:#F4EEDF;font-weight:700;font-size:15px;align-self:flex-end}
.panelrow{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:13px;color:#DCEBE3;gap:8px}
.panelrow b{color:#FFE7A0} .panelrow .okc{color:#9FE0C2}
.solvebtn{border:0;border-radius:999px;min-height:36px;padding:0 16px;font-weight:700;font-size:15px;background:linear-gradient(180deg,#F6D06B,#E3AE3B);color:#3A2A08;box-shadow:0 3px 0 #A97A1E;cursor:pointer}
.solvein{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.solvein:focus{outline:none;border-color:var(--jade)}
.preview{display:flex;flex-wrap:wrap;gap:5px 11px;justify-content:center;margin:10px 0 14px}
.preview .lc{background:#EDE6D8;border-bottom-color:#CFC3AD} .preview .punct{color:var(--ink)}
.dark .preview .lc{background:#3A3F45}
/* ---------- efectes ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:900;overflow:hidden}
#fx .tile{transition:none}
.ring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 18px rgba(246,200,90,.8)}
.spark{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#FFE7A0;box-shadow:0 0 8px #F6C85A}
.floatnote{position:absolute;font-family:var(--serif);font-weight:700;color:#FFE7A0;text-shadow:0 2px 6px rgba(0,0,0,.45);white-space:nowrap;transform:translate(-50%,-50%)}
.combo{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-family:var(--serif);font-weight:700;font-size:30px;color:#FFE7A0;text-shadow:0 3px 10px rgba(0,0,0,.5);white-space:nowrap}
.petal{position:absolute;top:-40px;font-size:22px}
.toast{position:absolute;left:50%;top:40%;text-align:center;max-width:80%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:1100}
/* ---------- fulls ---------- */
#sheet{position:absolute;inset:0;z-index:1000;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,16,.5);display:flex;align-items:flex-end;pointer-events:auto;animation:fade .25s}
.sheet{background:var(--surface);width:100%;border-radius:26px 26px 0 0;padding:12px 20px 24px;max-height:94%;overflow-y:auto;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:16px}
@keyframes up{from{transform:translateY(60px);opacity:.3}} @keyframes fade{from{opacity:0}}
.offer{border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:transparent;width:100%;text-align:left}
.offer.best{border-color:var(--jade);background:var(--jade-soft)}
.offer b{font-size:18px} .offer small{display:block;color:var(--quiet);font-size:14px;margin-top:2px}
.price{font-weight:700;font-size:18px;white-space:nowrap}
.fine{font-size:14px;color:var(--quiet);text-align:center;margin-top:12px}
.bigtime{font-family:var(--serif);font-size:56px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;color:var(--jade)}
.dark .bigtime{color:#9FD6C4}
.medalbig{width:96px;height:96px;margin:0 auto;animation:medal .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes medal{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.grid{font-size:22px;letter-spacing:2px;text-align:center;margin:10px 0}
.meaning{background:var(--jade-soft);border-radius:18px;padding:12px 16px;margin:8px 0 4px;font-size:15px;text-align:left;line-height:1.45}
.meaning .ph{display:block;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.25;quotes:"«" "»"}
.meaning .mn{display:block;color:var(--quiet);margin-top:4px}
.meaning .new{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--jade)}
.dark .meaning{background:#2A3A36} .dark .meaning .new{color:#9FD6C4}
.mel{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:4px}
.mel i{flex:0 1 8px;min-width:4px;border-radius:4px;background:var(--line);transition:background .15s,transform .15s}
.mel i.on{background:var(--gold);transform:scaleY(1.15)}
.mel i.c2{background:color-mix(in srgb,var(--jade) 45%,var(--line))}
.listenbtn{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:10px 14px;cursor:pointer;font:inherit;text-align:left;margin-top:6px}
.listenbtn .playbtn{width:44px;height:44px} .listenbtn small{display:block;color:var(--quiet);font-size:14px}
.vs{display:flex;justify-content:center;gap:10px;margin:10px 0}
.vs div{flex:1;max-width:140px;border:2px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center}
.vs div.win{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.vs small{display:block;color:var(--quiet);font-size:13px} .vs b{font-family:var(--serif);font-size:26px}
.album{list-style:none;padding:0;margin:8px 0 0}
.album li{border-bottom:1px solid var(--line);padding:10px 2px}
.album li:last-child{border-bottom:0}
.album q{font-family:var(--serif);font-size:18px;font-weight:700;quotes:"«" "»"}
.album .mn{color:var(--quiet);font-size:14px;margin:3px 0 0}
.album .blank{letter-spacing:3px;color:var(--quiet);font-weight:700}
.cardbtn{cursor:pointer} .cardbtn:active{transform:scale(.99)}
.chev{font-size:26px;color:var(--quiet);line-height:1}
/* ---------- inici ---------- */
.brand{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--jade);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.dark .brand{color:#9FD6C4}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);transform:rotate(45deg)}
.streakchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.hero{border-radius:26px;padding:22px 20px 20px;margin:14px 0;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(20,60,45,.3)}
.hero h2{margin:8px 0 4px;font-size:28px;color:#fff;max-width:calc(100% - 128px)}
.hero .sub{max-width:calc(100% - 110px)}
.hero .sub{color:#DCEBE3;font-size:15px;position:relative}
.hero .stackt{position:absolute;right:14px;top:18px;width:120px;height:110px}
.hero .stackt .tile{transition:none}
.hero .btn{margin-top:22px;position:relative;z-index:2}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--quiet)}
.week i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);font-style:normal;font-weight:700}
.week i.done{background:var(--jade);border-color:var(--jade);color:#fff}
.week i.today{border-color:var(--gold);border-width:3px}
.listen{display:flex;align-items:center;gap:14px}
.playbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade-soft);color:var(--jade);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.playbtn svg{width:22px;height:22px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--jade),#3BA483)}
/* nivells */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.theme{border-radius:20px;padding:14px;min-height:150px;border:0;cursor:pointer;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.theme b{font-family:var(--serif);font-size:20px;position:relative;z-index:2} .theme small{opacity:.9;position:relative;z-index:2}
.theme .mini{position:absolute;right:10px;top:10px;width:70px;height:80px}
.theme .mini .tile{transition:none}
.theme.locked{filter:grayscale(.6);opacity:.7}
/* classificació */
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;border:0;border-radius:999px;min-height:42px;font-size:15px;background:transparent;cursor:pointer}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chips button{border-radius:999px;min-height:40px;padding:0 14px;font-size:15px;border:2px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:16px 0 8px}
.podium div{flex:1;text-align:center;font-size:14px}
.podium .blk{border-radius:14px 14px 4px 4px;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--serif);font-weight:700;font-size:22px;color:#fff}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb .pos{width:32px;text-align:right;font-weight:700;color:var(--quiet)} .lb .nm{flex:1}
.lb li.me{background:var(--jade-soft);border-radius:12px;padding:0 8px;border:0}
/* perfil */
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:58px;border-bottom:1px solid var(--line)}
.sw{width:56px;height:32px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--jade)} .sw.on::after{left:27px}
.medals{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.medal{width:74px;text-align:center;font-size:13px;color:var(--quiet)}
.medal svg{width:56px;height:56px;display:block;margin:0 auto 4px}
/* splash */
.splash{position:absolute;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
.splash .word{font-family:var(--serif);font-size:44px;font-weight:700;color:#F6E7C1;letter-spacing:-.5px;animation:rise .8s .5s both cubic-bezier(.2,.9,.3,1.2)}
.splash .tag{color:#CFE3DA;animation:rise .8s .8s both}
.splash .tiles3{position:relative;width:160px;height:90px}
.splash .tiles3 .tile{transition:none}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

  box-shadow:0 0 0 10px rgba(251,246,236,.55),0 24px 60px rgba(0,0,0,.45);animation:medin .8s 1.05s cubic-bezier(.3,1.5,.6,1) both}

Object.assign(TR.es,{"Idioma": "Idioma", "Instruccions de la prova": "Instrucciones de la prueba", "Gràcies per ajudar-nos.": "Gracias por ayudarnos.", "Estem provant un joc per al mòbil que encara està en fase d’esbós: el nom i els textos són provisionals.": "Estamos probando un juego para el móvil que todavía está en fase de boceto: el nombre y los textos son provisionales.", "No t’avaluem a tu, sinó el joc. Si alguna cosa no s’entén, és culpa del joc, i això és just el que volem descobrir.": "No te evaluamos a ti, sino al juego. Si algo no se entiende, es culpa del juego, y eso es justo lo que queremos descubrir.", "Juga com si fossis a casa, sense pressa. Fixa’t en què et sorprèn, què no entens i què t’agrada: després t’ho preguntarem.": "Juega como si estuvieras en casa, sin prisa. Fíjate en qué te sorprende, qué no entiendes y qué te gusta: después te lo preguntaremos.", "Pots ser tan sincer com vulguis: no has de quedar bé amb ningú.": "Puedes ser tan sincero como quieras: no tienes que quedar bien con nadie.", "Com funciona": "Cómo funciona", "Juga uns 10–15 minuts i prova les coses de la llista, a poc a poc.": "Juega unos 10–15 minutos y prueba las cosas de la lista, poco a poco.", "Quan hagis jugat una partida, a Avui i a Perfil apareixerà «Respondre l’enquesta». La pots fer quan vulguis.": "Cuando hayas jugado una partida, en Hoy y en Perfil aparecerá «Responder la encuesta». Puedes hacerla cuando quieras.", "L’enquesta són uns 7 minuts i és anònima.": "La encuesta son unos 7 minutos y es anónima.", "Què has de provar": "Qué tienes que probar", "No cal fer-ho en ordre. Si alguna cosa no et surt, no passa res: és el que volem saber.": "No hace falta hacerlo en orden. Si algo no te sale, no pasa nada: es lo que queremos saber.", "És un prototip: no es cobra res i no cal registrar-se. Tot el que veuràs de pagaments és simulat.": "Es un prototipo: no se cobra nada y no hace falta registrarse. Todo lo que veas de pagos es simulado.", "Tornar al joc": "Volver al juego", "Ho he llegit, comencem": "Lo he leído, empecemos", "L’enquesta encara no està a punt": "La encuesta todavía no está lista", "Fas la prova del joc?": "¿Haces la prueba del juego?", "Llegeix les instruccions abans de començar (1 minut)": "Lee las instrucciones antes de empezar (1 minuto)", "La prova": "La prueba", "Gràcies per jugar! Pots respondre l’enquesta quan vulguis.": "¡Gracias por jugar! Puedes responder la encuesta cuando quieras.", "Juga una partida i podràs respondre l’enquesta.": "Juega una partida y podrás responder la encuesta.", "Respondre l’enquesta": "Responder la encuesta", "Veure les instruccions": "Ver las instrucciones", "Prova de Melodia": "Prueba de Melodia", "Instruccions": "Instrucciones", "Mira la pantalla d'inici: de què creus que va el joc?": "Mira la pantalla de inicio: ¿de qué crees que va el juego?", "Juga la partida del dia. Si no saps com, busca «Com es juga».": "Juega la partida del día. Si no sabes cómo, busca «Cómo se juega».", "Fes servir el faristol (la safata on pots apartar fitxes).": "Usa el atril (la bandeja donde puedes apartar fichas).", "Intenta endevinar el refrany amagat.": "Intenta adivinar la frase oculta.", "Quan acabis la partida, mira la postal del dia i prova d'enviar-la.": "Cuando acabes la partida, mira la postal del día e intenta enviarla.", "Busca la classificació.": "Busca la clasificación.", "A Perfil, Ajustos: fes les fitxes més grans i canvia els colors.": "En Perfil, Ajustes: haz las fichas más grandes y cambia los colores.", "Juga un nivell que no sigui el del dia.": "Juega un nivel que no sea el del día.", "Fes 3 errors expressament (arrossega fitxes damunt d'altres que no són la seva parella) i mira què passa.": "Haz 3 errores a propósito (arrastra fichas encima de otras que no son su pareja) y mira qué pasa.", "Quan acabis una partida, intenta endevinar quina cançó sonava.": "Cuando acabes una partida, intenta adivinar qué canción sonaba.", "A Classificació, crea una lliga per a la teva gent Object.assign(TR.en,{"Idioma": "Language", "Instruccions de la prova": "Test instructions", "Gràcies per ajudar-nos.": "Thanks for helping us.", "Estem provant un joc per al mòbil que encara està en fase d’esbós: el nom i els textos són provisionals.": "We're testing a mobile game that is still an early sketch: the name and texts are provisional.", "No t’avaluem a tu, sinó el joc. Si alguna cosa no s’entén, és culpa del joc, i això és just el que volem descobrir.": "We're testing the game, not you. If something is unclear, that's the game's fault, and that's exactly what we want to find out.", "Juga com si fossis a casa, sense pressa. Fixa’t en què et sorprèn, què no entens i què t’agrada: després t’ho preguntarem.": "Play as if you were at home, with no rush. Notice what surprises you, what you don't understand and what you like: we'll ask you afterwards.", "Pots ser tan sincer com vulguis: no has de quedar bé amb ningú.": "Be as honest as you like: you don't have to please anyone.", "Com funciona": "How it works", "Juga uns 10–15 minuts i prova les coses de la llista, a poc a poc.": "Play for about 10–15 minutes and try the things on the list, slowly.", "Quan hagis jugat una partida, a Avui i a Perfil apareixerà «Respondre l’enquesta». La pots fer quan vulguis.": "Once you've played a game, “Answer the survey” appears in Today and in Profile. You can do it whenever you like.", "L’enquesta són uns 7 minuts i és anònima.": "The survey takes about 7 minutes and it's anonymous.", "Què has de provar": "What to try", "No cal fer-ho en ordre. Si alguna cosa no et surt, no passa res: és el que volem saber.": "You don't have to follow the order. If something doesn't work for you, that's fine: it's exactly what we want to know.", "És un prototip: no es cobra res i no cal registrar-se. Tot el que veuràs de pagaments és simulat.": "This is a prototype: nothing is charged and you don't need to sign up. Any payments you see are simulated.", "Tornar al joc": "Back to the game",   let sp=''; for(let i=0;i<90;i++) sp+=`<circle cx="${f1(r()*100)}" cy="${f1(r()*100)}" r="${f1(.35+r()*.8)}" fill="${r()<.5?'#ADA79B':'#D4CFC5'}" opacity=".7"/>`;
  const P='M0 0C-11 -11 -11 -29 0 -38C11 -29 11 -11 0 0Z', V='M0 -4L0 -31';
  const petal=(tf,sc=1)=>`<g transform="${tf} scale(${sc})"><path d="${P}" fill="${edge}" transform="translate(1.2 1.2)"/><path d="${P}" fill="${pet}"/><path d="${P}" fill="none" stroke="${lite}" stroke-width="1.1" opacity=".8" transform="translate(-.6 -.6)"/><path d="${V}" stroke="${edge}" stroke-width="1"/></g>`;
  const centre=[0,90,180,270].map(a=>petal(`translate(50 50) rotate(${a})`)).join('');
  const corners=[[0,0,135],[100,0,-135],[100,100,-45],[0,100,45]].map(([x,y,a])=>petal(`translate(${x} ${y}) rotate(${a})`,.8)+`<circle cx="${x}" cy="${y}" r="6" fill="${pet}" stroke="${edge}" stroke-width="1"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${base}"/>${sp}${corners}${centre}<circle cx="50" cy="50" r="7" fill="${pet}" stroke="${edge}" stroke-width="1.2"/><circle cx="49.4" cy="49.4" r="2.6" fill="${lite}"/><rect x=".5" y=".5" width="99" height="99" fill="none" stroke="rgba(0,0,0,.16)"/></svg>`; }

// Una rajola de 100×100: es dibuixa un quadrant i es gira 4 vegades, com les rajoles de debò
function rajolaSVG(seed, pal){ const r=rng('raj'+seed), P=pal||uiPal(), G=P[0], C=P.slice(1);
  const pick=ex=>{ let c; do{ c=C[Math.floor(r()*4)]; }while(ex&&ex.includes(c)); return c; };
  const ca=pick(), cb=pick([ca]), cc=pick([ca,cb]), q=[]; const kind=Math.floor(r()*5);
  const R=f1(26+r()*14);                                   // quart de cercle a la cantonada (fa cercles en ajuntar-se)
  q.push(`<path d="M0 0H${R}A${R} ${R} 0 0 1 0 ${R}Z" fill="${ca}"/>`);
  if(r()<.75){ const R2=f1(R*.62), R3=f1(R*.32); q.push(`<path d="M0 0H${R2}A${R2} ${R2} 0 0 1 0 ${R2}Z" fill="${G}"/><path d="M0 0H${R3}A${R3} ${R3} 0 0 1 0 ${R3}Z" fill="${cc}"/>`); }
  if(kind!==1){ const h=f1(8+r()*9); q.push(`<path d="M${f1(50-h)} 0A${h} ${h} 0 0 0 ${f1(50+h)} 0Z" fill="${cb}"/>`); if(r()<.5) q.push(`<circle cx="50" cy="0" r="${f1(h*.45)}" fill="${G}"/>`); }
  const pl=f1(13+r()*9), pw=f1(4.5+r()*4), px=f1(50-pl*.78);          // pètal cap a la cantonada
  q.push(`<ellipse cx="${px}" cy="${px}" rx="${pw}" ry="${pl}" transform="rotate(-45 ${px} ${px})" fill="${cb}"/>`);
  if(kind===2||kind===4) q.push(`<path d="M50 ${f1(50-36)}L${f1(50-7)} ${f1(50-17)}L50 ${f1(50-12)}L${f1(50+7)} ${f1(50-17)}Z" fill="${ca}"/>`);
  if(kind===3) q.push(`<path d="M${f1(50-24)} 50L50 ${f1(50-24)}" stroke="${cc}" stroke-width="3" stroke-linecap="round"/>`);
  if(kind===4) q.push(`<circle cx="${f1(50-31)}" cy="${f1(50-31)}" r="3" fill="${cc}"/>`);
  if(r()<.55) q.push(`<path d="M3 3H97" stroke="${C[3]}" stroke-width="1.6"/>`);   // filet de vora
  const cr=f1(8+r()*6);
  const center = (kind===0||kind===3)
    ? `<rect x="${f1(50-cr)}" y="${f1(50-cr)}" width="${f1(cr*2)}" height="${f1(cr*2)}" transform="rotate(45 50 50)" fill="${cc}"/><circle cx="50" cy="50" r="${f1(cr*.55)}" fill="${G}"/><circle cx="50" cy="50" r="${f1(cr*.28)}" fill="${ca}"/>`
    : `<circle cx="50" cy="50" r="${cr}" fill="${cc}"/><circle cx="50" cy="50" r="${f1(cr*.6)}" fill="${G}"/><circle cx="50" cy="50" r="${f1(cr*.3)}" fill="${ca}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${G}"/>${[0,90,180,270].map(a=>`<g transform="rotate(${a} 50 50)">${q.join('')}</g>`).join('')}${center}<rect x=".5" y=".5" width="99" height="99" fill="none" stroke="rgba(0,0,0,.10)"/></svg>`; }
const RCACHE = new Map();

function lev(a,b){ const m=a.length, n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function closeEnough(a,b){ if(a===b) return true; const tol=Math.floor(b.length/12); return tol>0 && Math.abs(a.length-b.length)<=tol && lev(a,b)<=tol; }

function mainLayout(r, target){

    const sup=(x,y,z)=>[[.5,.5],[1.5,.5],[.5,1.5],[1.5,1.5]].filter(([dx,dy])=>p.some(t=>t.z===z-1&&covers(t,x+dx,y+dy))).length>=3;
    const clash=(x,y,z)=>p.some(t=>t.z===z&&Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2);
    const nsup=(x,y,z)=>p.filter(t=>t.z===z-1&&Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2).length, PRI={1:0,2:1.2,3:4.5,4:6};   // preferència per a les que reposen sobre 2, 3 o 4

function greedyRate(tiles, r, runs=24){ let win=0;
  for(let k=0;k<runs;k++){ let rem=tiles.slice();
    while(rem.length){ const free=rem.filter(t=>isFree(t,rem)); const by={}; free.forEach(t=>(by[t.s]=by[t.s]||[]).push(t));

      const a=opts[Math.floor(r()*opts.length)]; const x=a.splice(Math.floor(r()*a.length),1)[0], y=a[Math.floor(r()*a.length)];

function generate(seedStr, theme, nPairs=28){ let best=null;
  const lvM=/^lvl-(\d+)$/.exec(seedStr), tgt=lvM?levelTarget(+lvM[1]):null, need=nPairs>38?1:(lvM?8:5);
  for(let a=0;a<90 && (!best||best.n<need);a++){ const r=rng(seedStr+'#'+a); const pos0=layout(rng(seedStr+'L'+a), nPairs*2).map((p,i)=>({...p,id:i}));

    const pickT=(free,rem)=>{ const pf=free.filter(t=>t.pile); if(pf.length && r()<.75){ const h=t=>rem.reduce((n,o)=>n+(o.pile&&o.x===t.x?1:0),0); let best=pf[0], bh=h(best); for(const t of pf){ const v=h(t); if(v>bh){ best=t; bh=v; } } return free.splice(free.indexOf(best),1)[0]; } return free.splice(Math.floor(r()*free.length),1)[0]; };

    const all=levelPool(seedStr, theme, r, nPairs);

function shuffleBoard(){ const g=S.game; if(!g||g.busy) return; const calm=g.mode==='calma'; if(!calm&&g.shuffled) return;
  g.reserve.forEach(r=>{ if(r) g.tiles[r.id].gone=false; }); g.reserve=Array(SLOTS).fill(null); g.sel=null; g.lastPark=null;
  const rem=present(), by={}; rem.forEach(t=>by[t.s]=(by[t.s]||0)+1); const pairSyms=[]; Object.entries(by).forEach(([sy,n])=>{ for(let k=0;k<Math.floor(n/2);k++) pairSyms.push(sy); });
  for(let a=0;a<80;a++){ const r=rng(g.seedStr+'sh'+(g.shuffles||0)+'#'+a); let left=rem.slice(); const pairs=[]; let ok=true;
    const pickT=(free,rem)=>{ const pf=free.filter(t=>t.pile); if(pf.length && r()<.75){ const h=t=>rem.reduce((n,o)=>n+(o.pile&&o.x===t.x?1:0),0); let best=pf[0], bh=h(best); for(const t of pf){ const v=h(t); if(v>bh){ best=t; bh=v; } } return free.splice(free.indexOf(best),1)[0]; } return free.splice(Math.floor(r()*free.length),1)[0]; }; while(left.length){ const free=left.filter(t=>isFree(t,left)); if(free.length<2){ ok=false; break; } const A=pickT(free,left), B=pickMix(free,A,r); pairs.push([A,B]); left=left.filter(t=>t!==A&&t!==B); }
    if(!ok||pairs.length!==pairSyms.length) continue; const ps=pairSyms.slice(); for(let i=ps.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [ps[i],ps[j]]=[ps[j],ps[i]]; }

  S.sheet=null; render(); toast(L('Fitxes barrejades: ara el tauler torna a tenir solució')); }

const PIANO_A=[[[7,2],[4,1],[5,1],[7,2],[12,2]],[[9,3],[7,1],[5,2],[4,2]],[[5,2],[9,2],[12,3],[9,1]],[[7,4],[5,2],[2,2]],
  [[4,2],[7,1],[9,1],[7,2],[4,2]],[[5,2],[9,2],[7,2],[5,2]],[[2,2],[5,1],[4,1],[2,2],[-1,2]],[[0,8]]];
const PIANO_B=[[[9,2],[12,2],[14,2],[12,2]],[[16,3],[14,1],[12,4]],[[14,2],[17,2],[16,2],[14,2]],[[11,4],[7,4]],
  [[11,2],[16,2],[14,2],[11,2]],[[12,3],[11,1],[9,4]],[[5,2],[9,2],[11,2],[14,2]],[[12,8]]];
const PCH={C:[-12,-8,-5],Am:[-15,-12,-8],F:[-7,-3,0],G:[-17,-13,-10],Dm:[-10,-7,-3],Em:[-8,-5,-1]};
const PIANO_HA=['C','Am','F','G','C','F','G','C'], PIANO_HB=['F','C','Dm','G','Em','Am','Dm|G','C'];
function pianoScore(){ const E=[], q=.42; let t=0;   // q = una corxera (≈ 72 negres per minut)
  [[PIANO_A,PIANO_HA],[PIANO_B,PIANO_HB],[PIANO_A,PIANO_HA]].forEach(([mel,har])=>mel.forEach((bar,bi)=>{
    let u=t; bar.forEach(([n,d])=>{ E.push({t:u,n,v:.085,d:d*q+.5}); u+=d*q; });
    const hs=har[bi].split('|'), last=bi===7;
    if(last){ const c=PCH[hs[0]]; [c[0]-12,...c].forEach((n,k)=>E.push({t:t+k*.06,n,v:.05,d:3.2})); }
    else for(let k=0;k<8;k++){ const c=PCH[hs[hs.length>1&&k>=4?1:0]], n=[c[0],c[2],c[1],c[2]][k%4]; E.push({t:t+k*q,n,v:k%4===0?.05:.036,d:q*2}); }
    t+=8*q; }));
  return {E, L:t+2*q}; }
function pianoNote(out, semi, t, vol, dur){ const f=261.63*Math.pow(2,semi/12), D=Math.min(3.5,dur+1);
  [[1,1,0],[2,.42,3],[3,.16,-4],[4,.07,2]].forEach(([m,a,det])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f*m; o.detune.value=det;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol*a,t+.006); g.gain.exponentialRampToValueAtTime(vol*a*.35,t+.25); g.gain.exponentialRampToValueAtTime(.0004,t+D); o.connect(g).connect(out); o.start(t); o.stop(t+D+.05); }); }
function pianoAmb(){ const g=ac.createGain(), lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; g.gain.value=0; g.gain.setTargetAtTime(.6,ac.currentTime,.6);
  lp.connect(g); g.connect(ac.destination); if(master) g.connect(master);   // una mica de l'eco del joc
  const {E,L}=pianoScore(); let t0=ac.currentTime+.3, i=0;
  const tick=()=>{ const lim=ac.currentTime+.8; while(t0+E[i].t<lim){ const e=E[i]; pianoNote(lp, e.n, t0+e.t, e.v, e.d); i++; if(i>=E.length){ i=0; t0+=L; } } };
  tick(); const id=setInterval(tick,200);
  return {k:'piano', g, stop:[{stop:()=>clearInterval(id)}]}; }

function loopAmb(k, score, play, vol){ const g=ac.createGain(); g.gain.value=0; g.gain.setTargetAtTime(vol,ac.currentTime,.6); g.connect(ac.destination);
  const {E,L}=score, out=play.init?play.init(g):g; let t0=ac.currentTime+.3, i=0;
  const tick=()=>{ const lim=ac.currentTime+.8; while(t0+E[i].t<lim){ play(out, E[i], t0+E[i].t); i++; if(i>=E.length){ i=0; t0+=L; } } };
  tick(); const id=setInterval(tick,200); return {k, g, stop:[{stop:()=>clearInterval(id)}]}; }

// Guitarra (composició pròpia, la menor, estil clàssic espanyol): arpegis amb els dits i, la segona volta, melodia a dalt. Corda pinçada (Karplus-Strong)

const GMEL=[[12,9],[11,7],[9,12],[11,8],[12,16],[14,17],[16,11],[12,9],[12,16],[14,11],[12,9],[11,7],[9,12],[14,9],[8,11],[9,9]];
function guitarScore(){ const E=[], q=.3; let t=0;
  for(let pass=0;pass<2;pass++) GPROG.forEach((ch,bi)=>{ const [b,x,y,z]=GCH[ch], last=bi===15;
    const pat=last?[b]:[b,x,y,z,y,x];
    pat.forEach((n,k)=>E.push({t:t+k*q, n, v:k===0?.16:.11}));
    if(last) [x,y,z].forEach((n,k)=>E.push({t:t+.05*(k+1), n, v:.1}));
    if(pass===1){ const [m1,m2]=GMEL[bi]; E.push({t:t, n:m1, v:.15}); if(!last) E.push({t:t+3*q, n:m2, v:.13}); }

// Rock (composició pròpia, mi menor, 120 per minut): bateria, baix i guitarra distorsionada amb acords de quinta
const RROOT={E:-20,G:-17,A:-15,D:-22,C:-24,B:-25};
const RRIFF=[ [[['E',0,4],['E',4,2],['G',6,1],['A',7,1]], [['E',0,4],['D',4,2],['C',6,1],['B',7,1]]],
              [[['C',0,4],['C',4,2],['D',6,2]], [['E',0,4],['G',4,2],['A',6,2]]] ];
function rockScore(){ const E=[], q=.25, BAR=8*q; let t=0;
  [0,0,1,0,0,1,1,0].forEach(ri=>{ RRIFF[ri].forEach(bar=>{
      bar.forEach(([ch,st,len])=>{ for(let k=0;k<len;k++){ const tt=t+(st+k)*q, mute=k>0;
        E.push({t:tt, ins:'gtr', n:RROOT[ch]+12, d:mute?q*.6:q*.95, v:mute?.6:1}); E.push({t:tt, ins:'bass', n:RROOT[ch], d:q*.9}); } });
      for(let k=0;k<8;k++){ const tt=t+k*q; E.push({t:tt, ins:'hat', v:k%2?.5:.8}); if(k===0||k===3||k===4) E.push({t:tt, ins:'kick'}); if(k===2||k===6) E.push({t:tt, ins:'snare'}); }
      t+=BAR; }); });
  E.push({t, ins:'kick'}); E.push({t, ins:'crash'}); E.push({t, ins:'gtr', n:RROOT.E+12, d:1.6, v:1}); E.push({t, ins:'bass', n:RROOT.E, d:1.4});

  if(e.ins==='kick'){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+.18); g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.32); o.connect(g).connect(out.dry); o.start(t); o.stop(t+.35); return; }
  if(e.ins==='snare'||e.ins==='hat'||e.ins==='crash'){ const n=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); n.buffer=noiseBuf(); f.type='highpass';
    const [hp,v,d]= e.ins==='snare'?[1200,.5,.16]: e.ins==='hat'?[7000,.13*e.v,.045]:[4500,.3,1.4]; f.frequency.value=hp; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    n.connect(f).connect(g).connect(out.dry); n.start(t, Math.random()*.4); n.stop(t+d+.05);
    if(e.ins==='snare'){ const o=ac.createOscillator(), og=ac.createGain(); o.frequency.value=190; og.gain.setValueAtTime(.35,t); og.gain.exponentialRampToValueAtTime(.001,t+.1); o.connect(og).connect(out.dry); o.start(t); o.stop(t+.12); } return; }
  if(e.ins==='bass'){ const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(); o.type='sawtooth'; o.frequency.value=hz(e.n); f.type='lowpass'; f.frequency.value=420;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.4,t+.01); g.gain.setValueAtTime(.4,t+e.d*.8); g.gain.linearRampToValueAtTime(0,t+e.d); o.connect(f).connect(g).connect(out.dry); o.start(t); o.stop(t+e.d+.02); return; }
  if(e.ins==='gtr'){ const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22*e.v,t+.005); g.gain.setValueAtTime(.22*e.v,t+e.d*.85); g.gain.linearRampToValueAtTime(0,t+e.d); g.connect(out.gtr);
    [0,7,12].forEach((iv,k)=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(e.n+iv); o.detune.value=(k-1)*6; o.connect(g); o.start(t); o.stop(t+e.d+.02); }); } }
rockPlay.init = g => { const dry=ac.createGain(); dry.gain.value=1; dry.connect(g);
  const sh=ac.createWaveShaper(), c=new Float32Array(1024); for(let i=0;i<1024;i++){ const x=i/511.5-1; c[i]=Math.tanh(x*6)/Math.tanh(6); } sh.curve=c;

  pre.connect(sh).connect(lp).connect(post).connect(g); return {dry, gtr:pre}; };
function ambStart(){ const k=S.set.amb; if(!k||k==='cap'||!S.set.sound||!audio()) return ambStop(); if(ambNode&&ambNode.k===k) return; ambStop();
  if(k==='piano'){ ambNode=pianoAmb(); return; }
  if(k==='guitarra'){ ambNode=loopAmb(k, guitarScore(), guitarPlay, .55); return; }
  if(k==='rock'){ ambNode=loopAmb(k, rockScore(), rockPlay, .085); return; }
  const t=ac.currentTime, len=ac.sampleRate*4, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0); let last=0;

// Busca una manera de buidar el tauler des d'on és ara; si no n'hi ha (per culpa d'una parella mal triada), la mostra des del principi
function solveSeq(tiles, limit=40000){ let nodes=0; const memo=new Set();
  function rec(rem){ if(!rem.length) return []; if(++nodes>limit) return null; const key=rem.map(t=>t.id).sort((x,y)=>x-y).join(','); if(memo.has(key)) return null; memo.add(key);
    const free=rem.filter(t=>isFree(t,rem)), by={}; free.forEach(t=>(by[t.s]=by[t.s]||[]).push(t));
    for(const arr of Object.values(by)) if(arr.length>=2) for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){ const r=rec(rem.filter(t=>t!==arr[i]&&t!==arr[j])); if(r) return [[arr[i].id,arr[j].id],...r]; }
    return null; }
  return rec(tiles); }
async function showSolution(){ const g=S.game; if(!g||g.demo||g.busy) return;
  if(!g.counted){ g.counted=true; markPlayed(); stCount(false); }
  g.reserve.forEach(r=>{ if(r) g.tiles[r.id].gone=false; }); g.reserve=Array(SLOTS).fill(null); g.sel=null; g.lastPark=null;
  let seq=solveSeq(present()), fromStart=false;
  if(!seq){ g.tiles.forEach((t,i)=>{ t.gone=false; t.s=g.sym0[i]; }); g.pairs=0; seq=g.sol.slice(); fromStart=true; } // la solució que el joc va guardar en crear el tauler
  g.over=true; g.won=false; g.demo=true; if(!g.pauseAt) g.pauseAt=Date.now(); if(g.mode==='daily') S.dailySeen=true;
  S.sheet=null; render();
  const bar=document.createElement('div'); bar.className='demobar'; bar.setAttribute('role','status');
  bar.innerHTML=`<span>👁 ${fromStart?L('Solució des del principi'):L('Així es resol')}</span><button type="button">${L('Saltar')} ›</button>`; $('#phone').appendChild(bar);
  let fast=false; bar.querySelector('button').onclick=()=>{ fast=true; };
  for(const [x,y] of seq){ if(S.game!==g){ bar.remove(); return; } const ex=elOf({k:'b',id:x}), ey=elOf({k:'b',id:y});
    if(!fast){ [ex,ey].forEach(e=>e&&e.classList.add('demo')); await wait(reduced?250:560); }
    g.tiles[x].gone=true; g.tiles[y].gone=true; [ex,ey].forEach(e=>e&&e.classList.remove('demo'));
    const idx=g.pairs++; lettersForPair(idx).forEach(li=>{ if(!g.revealed.has(li)) revealLetter(li); });
    if(!fast) voice(g.song.n[idx%g.song.n.length],0,.15); updateTiles(); updateHUD(); if(!fast) await wait(reduced?60:170); }
  bar.remove(); g.order.forEach(li=>{ if(!g.revealed.has(li)) revealLetter(li); }); updateTiles(); updateHUD();
  await wait(500); if(S.game!==g||S.tab!=='joc') return; S.sheet='shown'; renderSheet(); }

const DAYKEY='melodia-v3-dies', MRANK={br:1,pl:2,or:3};
S.days=(()=>{ try{ return JSON.parse(localStorage.getItem(DAYKEY))||{}; }catch(e){ return {}; } })();

const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
// Medalla del dia: or si acabes sense ajuda, plata si acabes amb ajuda, bronze si hi jugues però no l'acabes. Es queda la millor del dia.
function dayMark(m){ const cur=S.days[todaySeed]; if(!cur||MRANK[m]>MRANK[cur]){ S.days[todaySeed]=m; try{ localStorage.setItem(DAYKEY,JSON.stringify(S.days)); }catch(e){} }
  const n=streakInfo().n; if(n>S.bestStreak){ S.bestStreak=n; try{ localStorage.setItem('melodia-v3-millor',n); }catch(e){} } }
// Ratxa: dies seguits jugats. Un dia sense jugar es cobreix amb un dia de descans (2 cada mes) si abans hi ha més dies jugats.
function streakInfo(){ const rests=new Set(), used={}; let n=(S.days[todaySeed]||chAll())?1:0, pending=[], d=addDays(today,-1);
  for(let k=0;k<400;k++){ const key=iso(d), mk=key.slice(0,7);
    if(S.days[key]){ n++; pending.forEach(x=>{ rests.add(x); used[x.slice(0,7)]=(used[x.slice(0,7)]||0)+1; }); pending=[]; }
    else { const u=(used[mk]||0)+pending.filter(x=>x.slice(0,7)===mk).length; if(u<2) pending.push(key); else break; }
    d=addDays(d,-1); }
  const cm=todaySeed.slice(0,7), left=Math.max(0, 2-[...rests].filter(x=>x.slice(0,7)===cm).length);
  return {n, rests, left, best:Math.max(S.bestStreak,n)}; }

function levelTarget(n){ const g=Math.floor((n-1)/10), i=(n-1)%10; return Math.max(.1, .80 - .55*Math.min(g,19)/19 - .10*i/9); }

const WIN=15, WINMAX=24, LAST=200;
const winSize = n => Math.max(WIN, Math.min(WINMAX, Math.ceil(levelPairsF(n)/2)+1+Math.floor(4*(Math.min(n,200)-1)/199)));   // cap al final, més dibuixos diferents i menys repetits
const winStart = n => Math.round((Math.min(n,LAST)-1)*(SEQ.length-WINMAX)/(LAST-1));
const levelWin = n => SEQ.slice(winStart(n), winStart(n)+winSize(n));

  if(!m) return sh([...THEMES[theme].sym]);
  if(nP>38){ const need=Math.min(SEQ.length, Math.ceil(nP/2)+1), st=Math.max(0,Math.min(winStart(+m[1]), SEQ.length-need)); return sh(SEQ.slice(st, st+need)); }
  const n=+m[1], nw=n>1?levelNew(n):[], rest=levelWin(n).filter(e=>!nw.includes(e));
  return [...sh([...nw]), ...sh(rest)]; }   // les noves van primer: segur que surten al tauler

    for(let k=0;k<n;k++){ const mode=['daily','level','level','calma','level','repte','daily'][Math.floor(r()*7)], hour=[8,9,10,11,13,16,17,18,19,21,22][Math.floor(r()*11)];
      const pairs=mode==='calma'?[28,28,40,60,100,150][Math.floor(r()*6)]:24+Math.floor(r()*13), won=mode==='calma'?r()<.97:r()<.58+.25*prog;
      const el=Math.round(pairs*(9.8-3.2*prog)*(.75+r()*.6)), hints=r()<.45?0:1+Math.floor(r()*3), misses=r()<.5?0:1+Math.floor(r()*2);

function stLogStreak(lg){ const day=ts=>{ const d=new Date(ts); d.setHours(12,0,0,0); return Math.round(+d/864e5); };
  const ds=[...new Set(lg.map(x=>day(x.ts)))].sort((a,b)=>a-b), set=new Set(ds); let best=0, run=0, prev=null;
  ds.forEach(d=>{ run = prev!=null&&d===prev+1 ? run+1 : 1; best=Math.max(best,run); prev=d; });
  let t=day(Date.now()); if(!set.has(t)) t--; let n=0; while(set.has(t)){ n++; t--; } return {n, best}; }

  fs+=4; const lh=fs*1.16, top=640-lines.length*lh/2+fs*.8; x.fillStyle=ink; lines.forEach((l,i)=>x.fillText(l,540,top+i*lh));

  x.fillStyle=c1; x.font='700 66px Fraunces, Georgia, serif'; x.fillText(g.mode==='calma'?L('Sense pressa'):fmt(total()),540,1098);
  x.fillStyle='#6B6158'; x.font='400 27px "Atkinson Hyperlegible", sans-serif';
  const songOk=g.songAns&&g.songAns===g.song; x.fillText((g.solved?L('Tauler i refrany resolts'):L('Tauler resolt'))+(songOk?' · ♪ '+L(g.song.k):''),540,1140);
  // peu sobre el mosaic
  x.font='700 26px "Atkinson Hyperlegible", sans-serif'; const foot=L('Fitxes i refranys'); const fw=x.measureText(foot).width+60;
  rr(x,540-fw/2,1252,fw,56,28); x.fillStyle=paper; x.fill(); x.fillStyle=ink; x.fillText(foot,540,1290);
  return cv; }
let postalJob=0;

function buy(k){ if(k==='pass') S.pass=true; else plusStart(k==='plusm'?'mes':'any'); toast(k==='pass'?L('Passi del dia activat (simulat)'):L('Plus activat (simulat)'));

let toastT; function toast(m,ms=2000){ clearTimeout(toastT);
  { const gm=(S.tab==='joc'&&S.game&&!S.sheet)?$('#gamemsg'):null; // M3: dins la partida, l'avís surt a la franja de dalt (mai damunt de fitxes ni del faristol)

function render(){ const ph=$('#phone'); const vkey=S.tab+'|'+S.lvGroup, osc=$('#view .screen'), otop=(S._vkey===vkey&&osc)?osc.scrollTop:0; S._vkey=vkey;
  ph.style.setProperty('--mosaic-hero', senURL(activeSen()));

  else { ambStop(); const ph=$('#phone'); ['--tw','--th','--sym'].forEach(v=>ph.style.removeProperty(v)); $('#view').innerHTML={avui:vAvui,nivells:vNivells,class:vClass,perfil:vPerfil}[S.tab](); if(S.tab==='class'){ bindChipDrag(); const c=$('#lgChips'), o=c&&c.querySelector('.on'); if(o) c.scrollLeft=Math.max(0,o.getBoundingClientRect().left-c.getBoundingClientRect().left-(c.clientWidth-o.offsetWidth)/2); } }
  if(otop&&S.tab!=='joc'){ const nsc=$('#view .screen'); if(nsc) nsc.scrollTop=otop; }

// splash
function splash(){ const d=document.createElement('div'); d.className='splash'; const cols=5, rows=9, P=uiPal();
  const seeds=[todaySeed,'a','b','c'].map(x=>rajolaData('splash'+x,P));
  let cells=''; for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){ const dist=Math.hypot(x-(cols-1)/2,(y-(rows-1)/2)*.8); const k=(x+y)%2?((x*7+y*3)%4):0;
    cells+=`<i style="background-image:url('${seeds[k]}');animation-delay:${reduced?0:Math.round(dist*85)}ms"></i>`; }
  d.innerHTML=`<div class="smosaic" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div>
    <div class="smedal"><span class="sring" style="background-image:url('${seeds[0]}')"></span><div class="word">${APP_NAME}</div><div class="tag">${L('Fitxes i refranys')}</div></div>`;
  $('#phone').appendChild(d);
  const close=then=>{ d.classList.add('out'); setTimeout(()=>d.remove(),600);
    if(then){ then(); return; } if(S.firstSheet&&!S.sheet){ S.sheet=S.firstSheet; renderSheet(); } S.firstSheet=null; };
  d.onclick=()=>close(); setTimeout(()=>close(), reduced?400:1650); }

// ================= Google Analytics (només si la persona ho accepta) =================
// L'identificador va a prova-config.js (window.MELODIA_GA = "G-XXXXXXX"). Sense identificador no es carrega res.
const GA_ID = String(window.MELODIA_GA || '').trim();
const APP_VER = (location.pathname.match(/\/(v\d+)\//)||[0,'v1'])[1];   // quina versió del prototip és: v1 (arrel), v2, v3…
let GA_CONSENT = null; try{ GA_CONSENT = localStorage.getItem('melodia-galetes'); }catch(e){}
let gaLoaded = false;
function gaLoad(){ if(gaLoaded || !GA_ID || GA_CONSENT!=='si') return; gaLoaded = true;
  window.dataLayer = window.dataLayer || []; window.gtag = function(){ dataLayer.push(arguments); };
  gtag('consent','default',{ analytics_storage:'granted', ad_storage:'denied', ad_user_data:'denied', ad_personalization:'denied' });
  gtag('js', new Date());
  gtag('config', GA_ID, { send_page_view:false, app_version: APP_VER, content_group: APP_VER, debug_mode: /[?&]debug_ga=1/.test(location.search) });
  gtag('set','user_properties',{ versio: APP_VER, idioma: LANG, partides: PV.games });
  const sc = document.createElement('script'); sc.async = true; sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID); document.head.appendChild(sc);
  pageView(S.tab); }
function track(name, params){ if(!gaLoaded || !window.gtag) return; try{ gtag('event', name, Object.assign({ versio: APP_VER, idioma: LANG }, params||{})); }catch(e){} }
function pageView(tab){ if(!gaLoaded) return; track('page_view', { page_title: APP_NAME+' ' + APP_VER + ' · ' + tab, page_location: location.origin + location.pathname + '#' + tab }); }
function setConsent(v){ GA_CONSENT = v; try{ localStorage.setItem('melodia-galetes', v); }catch(e){} document.querySelectorAll('.cookiebar').forEach(e=>e.remove()); if(v==='si') gaLoad(); }
function cookieBar(){ if(!GA_ID || GA_CONSENT) return; document.querySelectorAll('.cookiebar').forEach(e=>e.remove());
  const d = document.createElement('div'); d.className = 'cookiebar'; d.setAttribute('role','dialog'); d.setAttribute('aria-label', L('Galetes'));
  d.innerHTML = `<p>${L('Fem servir Google Analytics per saber com s’utilitza el prototip. És anònim: no recollim el teu nom ni el teu contacte.')}</p>
    <div><button type="button" class="ck-no">${L('Rebutjar')}</button><button type="button" class="ck-si">${L('Acceptar')}</button></div>`;
  d.querySelector('.ck-si').onclick = () => setConsent('si'); d.querySelector('.ck-no').onclick = () => setConsent('no');
  document.body.appendChild(d); }
function cookiePrefs(){ GA_CONSENT = null; try{ localStorage.removeItem('melodia-galetes'); }catch(e){} cookieBar(); }
// Esdeveniments: s'emboliquen les funcions del joc sense canviar-ne el comportament.
function gaWrap(name, ev, params, before){ const f = window[name]; if(typeof f !== 'function') return;
  window[name] = function(...a){ if(before) track(ev, params ? params(...a) : {}); const r = f.apply(this, a); if(!before){ try{ const pp = params ? params(...a) : {}; if(pp) track(ev, pp); }catch(e){} } return r; }; }
gaWrap('startGame', 'level_start', () => ({ mode: S.game&&S.game.mode, level: S.game&&S.game.level||0, tema: S.game&&S.game.theme, parelles: S.game&&S.game.nPairs }));
gaWrap('hint', 'hint_use', () => S.game&&!S.game.over ? { mode: S.game.mode } : null);

gaWrap('sendPostal', 'share', () => ({ method: 'postal' }));
gaWrap('challenge', 'share', () => ({ method: 'repte' }));
gaWrap('sendGift', 'regal_enviat');
gaWrap('acceptGift', 'regal_acceptat');
gaWrap('acceptChallenge', 'repte_acceptat');

gaWrap('acctDelete', 'compte_esborrat');

gaWrap('addPublic', 'lliga_oberta_afegida', k => ({ ambit: k }));
gaWrap('joinLeague', 'join_group', () => ({ group_id: 'lliga' }));
gaWrap('moveLgTo', 'lligues_ordenades', (f,t) => f!==t ? {} : null);
gaWrap('openSurvey', 'enquesta_oberta', () => ({ partides: PV.games }));
gaWrap('readInstr', 'tutorial_complete');
gaWrap('setLang', 'idioma_canviat', k => ({ a: k }), true);
try{ const kp=JSON.parse(sessionStorage.getItem('melodia-keep')||'null'); if(kp){ sessionStorage.removeItem('melodia-keep'); const {scroll, solvedIdx, ...rest}=kp; Object.assign(S, rest); S.set={...S.set, ...kp.set}; if(solvedIdx) S.solvedIdx=new Set(solvedIdx); S._keepScroll=scroll||0; } }catch(e){}

S.links=readLinks(); S.challenge=readChallenge(); render(); provaBar(); if(!S.skipSplash) splash(); cookieBar(); gaLoad();
if(S._keepScroll){ const sc=$('#view .screen'); if(sc) sc.scrollTop=S._keepScroll; requestAnimationFrame(()=>{ const s2=$('#view .screen'); if(s2) s2.scrollTop=S._keepScroll; }); }
{ const first = S.links.gift?'regal' : S.links.league?'lgjoin' : S.challenge?'repte' : null;
