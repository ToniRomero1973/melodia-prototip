<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E8%90%AC%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --surface:#FFFFFF; --ink:#1F2328; --quiet:#5B5F66; --line:#E6DDCD;
  --jade:#1F6F5C; --jade-d:#164F41; --jade-soft:#E2EFE9; --gold:#E9B949; --gold-d:#B8862B; --warn:#B5562F;
  --tw:50px; --th:66px; --gap:2px; --sym:34px;
  --serif:"Fraunces", Georgia, serif;
  --cjk:"Noto Serif TC","Songti SC","SimSun",serif;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.dark{ --bg:#191C1F; --surface:#24282C; --ink:#F1EEE8; --quiet:#B4B0A8; --line:#353A40; --jade-soft:#1F3A33; }
.size-gran{ --tw:55px; --th:72px; --sym:38px; }
.size-mgran{ --tw:58px; --th:76px; --sym:41px; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#CFC8BA}
body{display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink)}
button{font:inherit;color:inherit}
.phone{width:100%;max-width:400px;height:100%;max-height:860px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){ .phone{border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.3);border:10px solid #161616;height:860px} }
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;overflow-y:auto;padding:18px 20px 16px}
h1{font-family:var(--serif);font-size:30px;margin:4px 0;letter-spacing:-.3px} h2{font-family:var(--serif);font-size:23px;margin:18px 0 10px}
p{line-height:1.45;margin:6px 0} .muted{color:var(--quiet)}
.btn{font-size:18px;font-weight:700;border:0;border-radius:999px;min-height:54px;padding:0 22px;cursor:pointer;width:100%;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--jade);color:#fff;box-shadow:0 4px 0 var(--jade-d)}
.btn.gold{background:linear-gradient(180deg,#F6D06B,#E3AE3B);color:#3A2A08;box-shadow:0 4px 0 #A97A1E, 0 8px 18px rgba(0,0,0,.25)}
.btn.secondary{background:transparent;border:2px solid var(--line)}
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-block;background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.dark .pill{color:#9FD6C4}
/* ---------- tabs ---------- */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;font-size:13px;background:none;border:0;color:var(--quiet);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--jade);font-weight:700} .dark .tabs button.on{color:#9FD6C4}
/* ---------- fitxa ---------- */
.tile{position:absolute;width:var(--tw);height:var(--th);padding:0;border:0;background:none;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), filter .3s ease}
.tile::before{content:"";position:absolute;inset:0;border-radius:9px;transform:translate(3px,5px);
  background:linear-gradient(140deg,#2F9474 0%,#1C6550 55%,#134536 100%);box-shadow:2px 5px 9px rgba(0,0,0,.42)}
.face{position:absolute;inset:0;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(155deg,#FFFEFA 0%,#F7F0E2 55%,#ECE1CB 100%);
  box-shadow:inset 0 0 0 1px rgba(110,90,60,.22), inset 0 2px 0 #fff, inset 0 -3px 6px rgba(160,130,90,.15), 1.5px 2.5px 0 #DCCDB0}
.face svg{width:86%;height:86%;overflow:visible}
.face .emo{font-size:var(--sym);line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.tile.blocked{filter:brightness(.66) saturate(.7)}
.hc .tile.blocked .face::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 3px,transparent 3px 9px)}
.tile.sel{transform:translate(-1px,-8px)}
.tile.hint .face{animation:hintp .6s ease-in-out 0s 2 alternate, hintg 2.2s ease-out}
@keyframes hintp{to{transform:translateY(-7px) scale(1.06)}}
@keyframes hintg{0%,70%{box-shadow:0 0 0 4px var(--gold),0 0 24px rgba(246,200,90,.95)}100%{box-shadow:none}}
.slot.hintslot{animation:hints 1s ease-in-out 2}
@keyframes hints{50%{border-color:var(--gold);box-shadow:0 0 0 4px rgba(246,200,90,.6)}}
.hintbtn{display:flex;align-items:center;gap:4px;border:0;border-radius:11px;padding:0 10px;height:36px;background:var(--gchip,rgba(255,255,255,.12));color:var(--gink,inherit);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.hintbtn svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){ .tile.hint .face{animation:hintg 2.2s ease-out} .slot.hintslot{animation:none;border-color:var(--gold)} }
.tile.sel .face{box-shadow:inset 0 0 0 1px rgba(110,90,60,.22), 1.5px 2.5px 0 #DCCDB0, 0 0 0 3px var(--gold), 0 0 22px rgba(246,200,90,.9)}
@media (hover:hover){ .tile:not(.blocked):not(.sel):hover{transform:translateY(-3px)} }
.tile.gone{display:none}
.tile.shake{animation:shake .22s}
@keyframes shake{20%{translate:-4px 0}60%{translate:4px 0}}
/* ---------- joc ---------- */
.felt{background:radial-gradient(ellipse 120% 80% at 50% 38%,#2F7F65 0%,#215C4B 50%,#173F34 100%);color:#F4EEDF;position:relative}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:3px 3px,5px 5px;background-position:0 0,1px 2px}
.topbar{height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;position:relative;z-index:2}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.topbar .title{flex:1;font-weight:700;font-size:16px;line-height:1.15}
.topbar .title small{display:block;font-weight:400;opacity:.75;font-size:13px}
.chip{background:rgba(0,0,0,.22);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;white-space:nowrap}
.staff{height:44px;margin:0 14px;position:relative;z-index:2}
.staff svg{width:100%;height:100%}
.staff .n{fill:rgba(255,255,255,.22);transform-box:fill-box;transform-origin:center;transition:fill .3s}
.staff .n.on{fill:var(--gold);animation:pop .45s cubic-bezier(.34,1.8,.64,1)}
.staff .n.play{fill:#fff;animation:pop .3s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.8)}100%{transform:scale(1)}}
.boardwrap{flex:1;overflow:auto;display:flex;padding:8px 4px 14px;position:relative;z-index:1;isolation:isolate}
.board{position:relative;margin:auto;flex:none;touch-action:none}
.tile,.slot{touch-action:none;-webkit-user-select:none;user-select:none}
.tray{position:relative;z-index:2;padding:12px 14px 14px;background:linear-gradient(180deg,#A2724B 0%,#875A37 45%,#6B4429 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -2px 6px rgba(0,0,0,.3), 0 -6px 16px rgba(0,0,0,.25)}
.tray::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 7px,rgba(255,255,255,.12) 7px 8px,transparent 8px 13px)}
.slots{display:flex;gap:12px;justify-content:center;position:relative}
.slot{width:calc(var(--tw) + 8px);height:calc(var(--th) + 10px);border-radius:12px;border:0;padding:0;cursor:pointer;position:relative;
  background:rgba(40,22,10,.45);box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.15)}
.slot .tile{left:3px;top:2px}
.slot.warnpulse{animation:warnp 1.2s ease-in-out infinite}
@keyframes warnp{50%{box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 0 0 2px rgba(255,170,120,.7)}}
.trayinfo{display:flex;justify-content:space-between;font-size:14px;color:#F6E7D2;margin-top:10px;position:relative}
.trayinfo .w{color:#FFD2B8;font-weight:700}
.left .slots{flex-direction:row-reverse} .left .topbar{flex-direction:row-reverse}
/* ---------- faristol ---------- */
.stand{position:relative;z-index:2;padding:10px 16px 14px;background:linear-gradient(180deg,#22302B 0%,#18221F 100%);box-shadow:0 -8px 20px rgba(0,0,0,.28)}
.stand::after{content:"";position:absolute;left:50%;bottom:0;width:6px;height:12px;margin-left:-3px;background:#B8862B;border-radius:3px 3px 0 0;opacity:.7}
.standlabel{display:flex;align-items:center;gap:6px;justify-content:center;color:#E9D7A6;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.standlabel svg{width:16px;height:16px}
.stand .slots{gap:18px;padding-bottom:8px;border-bottom:3px solid #B8862B;border-radius:2px}
.stand .slot{background:rgba(255,255,255,.05);box-shadow:inset 0 2px 8px rgba(0,0,0,.55);border:1.5px dashed rgba(233,215,166,.35)}
.slot.target,.tile.target .face{outline:3px solid var(--gold);outline-offset:2px}
.tile.target{transform:scale(1.08)}
.slot.target{background:rgba(233,185,73,.18)}
#fx .tile.drag{z-index:50;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
.flynote{position:absolute;font-family:var(--serif);font-weight:700;font-size:22px;color:#FFE7A0;text-shadow:0 0 10px rgba(246,200,90,.9)}
.staff{display:flex;align-items:center;gap:6px}
.staff svg{flex:1}
.staffq{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:#FFE7A0;flex:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:2px solid var(--line);border-radius:16px;background:transparent;padding:8px 14px;text-align:left;cursor:pointer}
.opt small{display:block;color:var(--quiet);font-size:14px}
.opt.ok{border-color:#1F7A4D;background:#E3F2EA} .opt.bad{border-color:#B8322A;background:#FBE9E7}
.dark .opt.ok{background:#1F3A2C} .dark .opt.bad{background:#3A1F1F}
.disc{width:120px;height:120px;margin:4px auto 8px;border-radius:50%;background:radial-gradient(circle,#E9B949 0 14%,#1a1a1a 15% 17%,#2a2a2a 18% 30%,#1a1a1a 31% 33%,#2c2c2c 34% 48%,#1a1a1a 49% 51%,#262626 52% 100%);box-shadow:0 8px 20px rgba(0,0,0,.3);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- panell de frase ---------- */
.panel{margin:0 12px 2px;padding:8px 10px;border-radius:16px;background:rgba(0,0,0,.22);position:relative;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 11px}
.word{display:inline-flex;gap:2px}
.lc{width:16px;height:22px;border-radius:4px;background:rgba(255,255,255,.12);border-bottom:2px solid rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#1F2328}
.lc.on{background:linear-gradient(160deg,#FFFDF7,#EFE5D0);border-bottom-color:#C9B994;animation:flip .45s cubic-bezier(.3,1.5,.6,1)}
.lc.win{background:linear-gradient(160deg,#FFE7A0,#E9B949);border-bottom-color:#B8862B}
@keyframes flip{0%{transform:rotateX(90deg) scale(1.3)}100%{transform:none}}
.punct{color:#F4EEDF;font-weight:700;font-size:15px;align-self:flex-end}
.panelrow{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:13px;color:#DCEBE3;gap:8px}
.panelrow b{color:#FFE7A0} .panelrow .okc{color:#9FE0C2}
.solvebtn{border:0;border-radius:999px;min-height:36px;padding:0 16px;font-weight:700;font-size:15px;background:linear-gradient(180deg,#F6D06B,#E3AE3B);color:#3A2A08;box-shadow:0 3px 0 #A97A1E;cursor:pointer}
.solvein{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.solvein:focus{outline:none;border-color:var(--jade)}
.preview{display:flex;flex-wrap:wrap;gap:5px 11px;justify-content:center;margin:10px 0 14px}
.preview .lc{background:#EDE6D8;border-bottom-color:#CFC3AD} .preview .punct{color:var(--ink)}
.dark .preview .lc{background:#3A3F45}
/* ---------- efectes ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:900;overflow:hidden}
#fx .tile{transition:none}
.ring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 18px rgba(246,200,90,.8)}
.spark{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#FFE7A0;box-shadow:0 0 8px #F6C85A}
.floatnote{position:absolute;font-family:var(--serif);font-weight:700;color:#FFE7A0;text-shadow:0 2px 6px rgba(0,0,0,.45);white-space:nowrap;transform:translate(-50%,-50%)}
.combo{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-family:var(--serif);font-weight:700;font-size:30px;color:#FFE7A0;text-shadow:0 3px 10px rgba(0,0,0,.5);white-space:nowrap}
.petal{position:absolute;top:-40px;font-size:22px}
.toast{position:absolute;left:50%;top:40%;text-align:center;max-width:80%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:1100}
/* ---------- fulls ---------- */
#sheet{position:absolute;inset:0;z-index:1000;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,16,.5);display:flex;align-items:flex-end;pointer-events:auto;animation:fade .25s}
.sheet{background:var(--surface);width:100%;border-radius:26px 26px 0 0;padding:12px 20px 24px;max-height:94%;overflow-y:auto;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:16px}
@keyframes up{from{transform:translateY(60px);opacity:.3}} @keyframes fade{from{opacity:0}}
.offer{border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:transparent;width:100%;text-align:left}
.offer.best{border-color:var(--jade);background:var(--jade-soft)}
.offer b{font-size:18px} .offer small{display:block;color:var(--quiet);font-size:14px;margin-top:2px}
.price{font-weight:700;font-size:18px;white-space:nowrap}
.fine{font-size:14px;color:var(--quiet);text-align:center;margin-top:12px}
.bigtime{font-family:var(--serif);font-size:56px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;color:var(--jade)}
.dark .bigtime{color:#9FD6C4}
.medalbig{width:96px;height:96px;margin:0 auto;animation:medal .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes medal{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.grid{font-size:22px;letter-spacing:2px;text-align:center;margin:10px 0}
.meaning{background:var(--jade-soft);border-radius:18px;padding:12px 16px;margin:8px 0 4px;font-size:15px;text-align:left;line-height:1.45}
.meaning .ph{display:block;font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.25;quotes:"«" "»"}
.meaning .mn{display:block;color:var(--quiet);margin-top:4px}
.meaning .new{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--jade)}
.dark .meaning{background:#2A3A36} .dark .meaning .new{color:#9FD6C4}
.mel{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:4px}
.mel i{flex:0 1 8px;min-width:4px;border-radius:4px;background:var(--line);transition:background .15s,transform .15s}
.mel i.on{background:var(--gold);transform:scaleY(1.15)}
.mel i.c2{background:color-mix(in srgb,var(--jade) 45%,var(--line))}
.listenbtn{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:18px;padding:10px 14px;cursor:pointer;font:inherit;text-align:left;margin-top:6px}
.listenbtn .playbtn{width:44px;height:44px} .listenbtn small{display:block;color:var(--quiet);font-size:14px}
.vs{display:flex;justify-content:center;gap:10px;margin:10px 0}
.vs div{flex:1;max-width:140px;border:2px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center}
.vs div.win{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.vs small{display:block;color:var(--quiet);font-size:13px} .vs b{font-family:var(--serif);font-size:26px}
.album{list-style:none;padding:0;margin:8px 0 0}
.album li{border-bottom:1px solid var(--line);padding:10px 2px}
.album li:last-child{border-bottom:0}
.album q{font-family:var(--serif);font-size:18px;font-weight:700;quotes:"«" "»"}
.album .mn{color:var(--quiet);font-size:14px;margin:3px 0 0}
.album .blank{letter-spacing:3px;color:var(--quiet);font-weight:700}
.cardbtn{cursor:pointer} .cardbtn:active{transform:scale(.99)}
.chev{font-size:26px;color:var(--quiet);line-height:1}
/* ---------- inici ---------- */
.brand{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--jade);letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.dark .brand{color:#9FD6C4}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);transform:rotate(45deg)}
.streakchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.hero{border-radius:26px;padding:22px 20px 20px;margin:14px 0;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(20,60,45,.3)}
.hero h2{margin:8px 0 4px;font-size:28px;color:#fff;max-width:calc(100% - 128px)}
.hero .sub{max-width:calc(100% - 110px)}
.hero .sub{color:#DCEBE3;font-size:15px;position:relative}
.hero .stackt{position:absolute;right:14px;top:18px;width:120px;height:110px}
.hero .stackt .tile{transition:none}
.hero .btn{margin-top:22px;position:relative;z-index:2}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--quiet)}
.week i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);font-style:normal;font-weight:700}
.week i.done{background:var(--jade);border-color:var(--jade);color:#fff}
.week i.today{border-color:var(--gold);border-width:3px}
.listen{display:flex;align-items:center;gap:14px}
.playbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--jade-soft);color:var(--jade);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.playbtn svg{width:22px;height:22px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--jade),#3BA483)}
/* nivells */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.theme{border-radius:20px;padding:14px;min-height:150px;border:0;cursor:pointer;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.theme b{font-family:var(--serif);font-size:20px;position:relative;z-index:2} .theme small{opacity:.9;position:relative;z-index:2}
.theme .mini{position:absolute;right:10px;top:10px;width:70px;height:80px}
.theme .mini .tile{transition:none}
.theme.locked{filter:grayscale(.6);opacity:.7}
/* classificació */
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;gap:4px;margin:8px 0}

// Base de 5 d'ample × 7 d'alt (forats només a la vora, files desplaçades mitja fitxa) i capes al centre. Nombre EXACTE de fitxes (target).
function layout(r, target){
  const covers=(t,px,py)=>t.x<=px&&px<t.x+2&&t.y<=py&&py<t.y+2;
  for(let tries=0;tries<150;tries++){
    const p=[]; const cx=4, cy=6, edgeP= target>=60?.95:(target>=52?.85:.75);
    for(let row=0;row<7;row++){ const off=(row>0&&row<6&&r()<.25)?1:0, n=off?4:5;
      for(let c=0;c<n;c++){ const x=off+c*2, y=row*2; const edge=row===0||row===6||c===0||c===n-1; if(!edge || r()<edgeP) p.push({x,y,z:0}); } }
    if(p.length>target) continue;
    const supported=(x,y,z)=>[[.5,.5],[1.5,.5],[.5,1.5],[1.5,1.5]].every(([dx,dy])=>p.some(t=>t.z===z-1&&covers(t,x+dx,y+dy)));
    const clash=(x,y,z)=>p.some(t=>t.z===z&&Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2);
    for(let z=1;z<=6 && p.length<target;z++){ const cand=[]; for(let y=0;y<=12;y++)for(let x=0;x<=8;x++) if(supported(x,y,z)) cand.push([x,y, Math.hypot(x-cx,(y-cy)*.75)+r()*2]);
      cand.sort((a,b)=>a[2]-b[2]);
      for(const [x,y,d] of cand){ if(p.length>=target) break; if(!clash(x,y,z) && r()<.92*Math.max(.4,1-d/8)) p.push({x,y,z}); } }

  const p=[]; for(let y=0;y<14;y+=2)for(let x=0;x<10;x+=2) if(p.length<target) p.push({x,y,z:0});
  for(let z=1;z<=6&&p.length<target;z++) for(let y=z;y<=12-z&&p.length<target;y+=2) for(let x=z;x<=8-z&&p.length<target;x+=2){ if(!p.some(t=>t.z===z&&Math.abs(t.x-x)<2&&Math.abs(t.y-y)<2)) p.push({x,y,z}); }
  return p; }
function isFree(t, set){

// Simula un jugador que fa parelles visibles a l'atzar (sense faristol). Com menys vegades guanya, més difícil és el tauler.
function greedyRate(tiles, r, runs=24){ let win=0;
  for(let k=0;k<runs;k++){ let rem=tiles.slice();
    while(rem.length){ const free=rem.filter(t=>isFree(t,rem)); const by={}; free.forEach(t=>(by[t.s]=by[t.s]||[]).push(t));
      const opts=Object.values(by).filter(a=>a.length>=2); if(!opts.length) break;
      const a=opts[Math.floor(r()*opts.length)]; const x=a.splice(Math.floor(r()*a.length),1)[0], y=a[Math.floor(r()*a.length)];
      rem=rem.filter(t=>t!==x&&t!==y); }
    if(!rem.length) win++; }

function generate(seedStr, theme, nPairs=28){ let best=null;

    let rem=[...pos0]; const pairs=[]; let ok=true;
    while(rem.length){ const free=rem.filter(t=>isFree(t,rem)); if(free.length<2){ok=false;break}
      const A=free.splice(Math.floor(r()*free.length),1)[0], B=free[Math.floor(r()*free.length)];
      pairs.push([A,B]); rem=rem.filter(t=>t!==A&&t!==B); }

    const all=[...THEMES[theme].sym]; for(let i=all.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[all[i],all[j]]=[all[j],all[i]]}

function dims(){ const cs=getComputedStyle($('#phone')); return {W:parseFloat(cs.getPropertyValue('--tw')), H:parseFloat(cs.getPropertyValue('--th')), G:2}; }
function tilePos(t){ const {W,H,G}=dims(); return {left:t.x*(W+G)/2 - t.z*3 + 8, top:t.y*(H+G)/2 - t.z*4 + 14}; }
function phraseHTML(){ const g=S.game; const words=[]; let cur=[];
  [...g.phrase].forEach((ch,i)=>{ if(ch===' '){ if(cur.length) words.push(cur); cur=[]; } else cur.push([ch,i]); }); if(cur.length) words.push(cur);
  return words.map(w=>`<span class="word">${w.map(([ch,i])=> isLetter(ch) ? `<span class="lc ${g.revealed.has(i)?'on':''}" data-l="${i}">${g.revealed.has(i)?esc(ch.toUpperCase()):''}</span>` : `<span class="punct">${esc(ch)}</span>`).join('')}</span>`).join(''); }

  return `<div class="felt" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="topbar"><button class="iconbtn" aria-label="${L('Pausa')}" onclick="pause()">${ICON.pause}</button>
   <div class="title">${esc(g.title)}</div><button class="hintbtn" id="hintBtn" onclick="hint()" aria-label="${L('Pista: ensenya una parella (+{0} s)',HINT_PEN)}">${ICON.bulb}<span>${L('Pista')}</span></button><span class="chip" id="pairsLeft"></span><span class="chip" id="clock"></span></div>
  <div class="panel"><div class="phrase" id="phrase" aria-label="${L('Frase amagada')}">${phraseHTML()}</div>
   <button class="solvebtn" id="solveBtn" onclick="openSolve()">${L('Resoldre')}<small id="hidInfo"></small></button></div>
  <div class="boardwrap" id="boardwrap"><div class="board" style="width:${extents(g.tiles).cw*(W+G)+16}px;height:${extents(g.tiles).ch*(H+G)+20}px">${tiles}</div></div>
  <div class="stand"><div class="standside"><span class="standlabel">${ICON.stand}${L('Faristol')}</span><span id="resInfo"></span></div>
   <div class="slots">${Array.from({length:SLOTS},(_,i)=>`<button class="slot" data-s="${i}" aria-label="${L('Lloc {0} del faristol',i+1)}"></button>`).join('')}</div>
   <div class="standside r"><span id="errInfo"></span><span id="failInfo"></span></div></div></div>`; }

function updateTiles(){ const g=S.game, set=present();
  g.tiles.forEach(t=>{ const el=document.querySelector(`[data-t="${t.id}"]`); if(!el) return;

    const free=isFree(t,set); el.classList.toggle('blocked',!free); el.classList.toggle('sel', !!(g.sel&&g.sel.k==='b'&&g.sel.id===t.id));
    el.setAttribute('aria-label', label(t.s)+(free?'':L(', bloquejada'))); }); }
function updateReserve(){ const g=S.game; const full=g.reserve.filter(Boolean).length;
  document.querySelectorAll('.slot').forEach((el,i)=>{ const r=g.reserve[i]; const want=r?r.s:'';
    if(el.dataset.k!==want){ el.dataset.k=want; el.innerHTML = r?`<span class="tile" data-r="${i}" style="position:absolute"><span class="face">${faceHTML(r.s)}</span></span>`:''; if(r&&!reduced) el.firstChild.animate([{transform:'scale(.85)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:260}); }

function letterXY(i){ const n=document.querySelector(`#phrase [data-l="${i}"]`); if(!n) return null; const r=rel(n); return {x:r.x+r.w/2, y:r.y+r.h/2}; }
function fitBoard(){ const wrap=$('#boardwrap'), board=wrap&&wrap.querySelector('.board'); if(!board) return; const ph=$('#phone');
  ph.style.removeProperty('--tw'); ph.style.removeProperty('--th'); ph.style.removeProperty('--sym');
  const base=dims(); const aw=wrap.clientWidth-6, ah=wrap.clientHeight-6;
  const E=extents(S.game.tiles); const k=Math.min(1.3, (aw-4)/(E.cw*(base.W+2)+2), (ah-16)/(E.ch*(base.H+2))) * ({gran:1.15, mgran:1.3}[S.set.size]||1);
  if(k!==1){ ph.style.setProperty('--tw',(base.W*k).toFixed(1)+'px'); ph.style.setProperty('--th',(base.H*k).toFixed(1)+'px'); ph.style.setProperty('--sym',(base.W*k*.68).toFixed(1)+'px'); }
  const {W,H,G}=dims(); board.style.width=(E.cw*(W+G)+16)+'px'; board.style.height=(E.ch*(H+G)+20)+'px';
  S.game.tiles.forEach(t=>{ const el=board.querySelector(`[data-t="${t.id}"]`); if(!el) return; const p=tilePos(t); el.style.left=p.left+'px'; el.style.top=p.top+'px'; }); }

  if(!g.dealt){ g.dealt=true; if(!reduced){ const els=[...document.querySelectorAll('.board .tile')];
      els.sort((a,b)=>+a.style.zIndex - +b.style.zIndex).forEach((el,i)=>{ const z=Math.floor(+el.style.zIndex/1000);

const srcOf = el => el.dataset.t!==undefined ? {k:'b',id:+el.dataset.t} : {k:'r',i:+el.dataset.r};
const elOf = s => s.k==='b' ? document.querySelector(`.board [data-t="${s.id}"]`) : document.querySelector(`.slot[data-s="${s.i}"] .tile`);
const same = (a,b) => a&&b&&a.k===b.k&&(a.k==='b'?a.id===b.id:a.i===b.i);
function isFreeSrc(s){ return s.k==='r' || isFree(S.game.tiles[s.id], present()); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); click(300,.04); }
let D=null;
function bindDrag(){ const root=$('#view'); if(root.dataset.bound) return; root.dataset.bound='1';
  root.addEventListener('pointerdown',e=>{ if(D||S.tab!=='joc') return; const g=S.game; if(!g||g.over||g.busy) return;
    const tEl=e.target.closest('.tile'); const sEl=e.target.closest('.slot');
    if(!tEl){ if(sEl&&!g.reserve[+sEl.dataset.s]&&g.sel&&g.sel.k==='b') tapSlot(+sEl.dataset.s); return; }
    if(tEl.closest('#fx')) return; const src=srcOf(tEl);
    if(!isFreeSrc(src)){ shake(tEl); return; }
    D={src, el:tEl, x0:e.clientX, y0:e.clientY, moved:false, clone:null, target:null, pid:e.pointerId}; e.preventDefault(); });
  window.addEventListener('pointermove',e=>{ if(!D||e.pointerId!==D.pid) return; const dx=e.clientX-D.x0, dy=e.clientY-D.y0;
    if(!D.moved && Math.hypot(dx,dy)<9) return;
    if(!D.moved){ D.moved=true; const {c}=cloneAt(D.el); c.classList.add('drag'); D.clone=c; D.el.style.visibility='hidden'; S.game.sel=null; updateTiles(); updateReserve(); click(1100,.03); }
    const sc=$('#phone').getBoundingClientRect().width/$('#phone').offsetWidth||1;
    D.clone.style.transform=`translate(${dx/sc}px,${dy/sc}px) scale(1.1) rotate(${Math.max(-8,Math.min(8,dx/14))}deg)`;
    const under=document.elementFromPoint(e.clientX,e.clientY); let tgt=null;
    if(under){ const tt=under.closest('.tile'), ss=under.closest('.slot');
      if(tt&&!tt.closest('#fx')){ const s=srcOf(tt); if(!same(s,D.src)&&isFreeSrc(s)&&symOf(s)===symOf(D.src)) tgt={kind:'tile',s,el:tt}; }
      else if(ss&&!S.game.reserve[+ss.dataset.s]&&D.src.k==='b') tgt={kind:'slot',i:+ss.dataset.s,el:ss}; }
    if(D.target&&(!tgt||tgt.el!==D.target.el)) D.target.el.classList.remove('target');
    if(tgt&&(!D.target||tgt.el!==D.target.el)){ tgt.el.classList.add('target'); vib(6); }
    D.target=tgt; D.lx=e.clientX; D.ly=e.clientY; });
  const end=e=>{ if(!D||e.pointerId!==D.pid) return; const d=D; D=null;
    if(!d.moved){ return d.src.k==='b' ? tapTile(d.src.id) : tapSlot(d.src.i); }
    if(d.target) d.target.el.classList.remove('target');
    if(d.target&&d.target.kind==='tile') return doMatch(d.src,d.target.s,d.clone);
    if(d.target&&d.target.kind==='slot') return doPark(d.src.id,d.target.i,d.clone);
    // deixada damunt d'una fitxa que no és la parella: error
    // Només és error si l'has deixat lluny d'on era, damunt d'una fitxa lliure que no és la seva parella
    const under=document.elementFromPoint(d.lx,d.ly); const wt=under&&under.closest('.tile');
    const far=Math.hypot(d.lx-d.x0,d.ly-d.y0) > d.el.getBoundingClientRect().width*.8;
    if(far&&wt&&!wt.closest('#fx')&&!same(srcOf(wt),d.src)){ const ws=srcOf(wt);
      if(symOf(ws)===symOf(d.src)||!isFreeSrc(ws)){ shake(wt); toast(L('Aquesta fitxa encara està tapada')); } else wrongDrop(wt); }
    // torna al lloc
    const back=d.clone.animate([{transform:d.clone.style.transform},{transform:'none'}],{duration:reduced?1:260,easing:'cubic-bezier(.34,1.4,.64,1)'});
    back.onfinish=()=>{ d.clone.remove(); d.el.style.visibility=''; }; };
  window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end);
  root.addEventListener('click',e=>{ if(e.detail!==0||S.tab!=='joc') return; const g=S.game; if(!g||g.over||g.busy) return;
    const sl=e.target.closest('.slot'); if(sl) return tapSlot(+sl.dataset.s);
    const t=e.target.closest('.tile[data-t]'); if(!t) return; if(!isFreeSrc(srcOf(t))) return shake(t); tapTile(+t.dataset.t); }); }
const MAX_ERR=3;
function wrongDrop(el){ const g=S.game; g.errors=(g.errors||0)+1; el.classList.add('wrong'); shake(el); setTimeout(()=>el.classList.remove('wrong'),500);
  thump(0,.25); click(160,.12); vib([30,40,30]); updateErrors();
  if(g.errors>=MAX_ERR){ g.over=true; g.pauseAt=Date.now(); g.failReason='errors'; if(g.mode==='daily') S.dailyFailed='errors'; setTimeout(()=>{ S.sheet='blocked'; renderSheet(); },550); }
  else toast(L('Error {0} de {1}',g.errors,MAX_ERR)); }
function updateErrors(){ const g=S.game, el=$('#errInfo'); if(!el) return; const n=g.errors||0;
  el.setAttribute('aria-label',L('Errors: {0} de {1}',n,MAX_ERR)); el.innerHTML=L('Errors')+' '+Array.from({length:MAX_ERR},(_,i)=>`<i class="ed ${i<n?'on':''}"></i>`).join(''); }
function tapTile(id){ const g=S.game; const t=g.tiles[id];
  const sel=g.sel;
  if(sel&&sel.k==='b'&&sel.id===id){ g.sel=null; updateTiles(); return; }
  if(sel && symOf(sel)===t.s) return doMatch(sel,{k:'b',id});
  g.sel={k:'b',id}; click(); vib(5); updateTiles(); updateReserve();
  if(!S.tapTold){ S.tapTold=true; toast(L('Ara toca la seva parella, o un lloc buit del faristol')); } }
function tapSlot(i){ const g=S.game; if(g.over||g.busy) return; const sel=g.sel, r=g.reserve[i];
  if(!r){ if(sel&&sel.k==='b') return doPark(sel.id,i); return; }
  if(sel&&sel.k==='r'&&sel.i===i){ g.sel=null; updateReserve(); return; }
  if(sel && symOf(sel)===r.s) return doMatch(sel,{k:'r',i});
  g.sel={k:'r',i}; click(); updateTiles(); updateReserve(); }
function freeze(c){ const r=rel(c); c.style.left=r.x+'px'; c.style.top=r.y+'px'; c.style.transform='none'; c.classList.remove('drag'); return {c, r:rel(c)}; }
async function doPark(id,i,dragClone){ const g=S.game; g.busy++; const el=elOf({k:'b',id}); const slot=document.querySelector(`.slot[data-s="${i}"]`);
  const {c,r}= dragClone ? freeze(dragClone) : cloneAt(el); const sr=rel(slot); el.style.visibility='';
  g.tiles[id].gone=true; g.sel=null; updateTiles(); knock(); vib(8);
  if(!reduced) await c.animate([{transform:'none'},{transform:`translate(${(sr.x+4-r.x)/2}px,${(sr.y-r.y)/2-24}px) scale(1.05)`,offset:.5},{transform:`translate(${sr.x+4-r.x}px,${sr.y+4-r.y}px)`}],{duration:300,easing:'cubic-bezier(.4,0,.2,1)'}).finished;
  c.remove(); g.reserve[i]={s:g.tiles[id].s}; updateReserve(); updateHUD(); g.busy--; checkState(); }
async function doMatch(a,b,dragClone){ const g=S.game; g.busy++; const ea=elOf(a), eb=elOf(b);
  const A= dragClone ? freeze(dragClone) : cloneAt(ea); const B=cloneAt(eb);
  if(a.k==='b') g.tiles[a.id].gone=true; else g.reserve[a.i]=null;
  if(b.k==='b') g.tiles[b.id].gone=true; else g.reserve[b.i]=null;
  g.sel=null; const now=Date.now(); g.combo=(now-g.lastMatch<3500)?g.combo+1:1; g.lastMatch=now; const idx=g.pairs; g.pairs++;
  if(ea) ea.style.visibility=''; updateTiles(); updateReserve(); updateHUD();
  const ca={x:A.r.x+A.r.w/2,y:A.r.y+A.r.h/2}, cb={x:B.r.x+B.r.w/2,y:B.r.y+B.r.h/2};
  const m = dragClone ? cb : {x:(ca.x+cb.x)/2, y:Math.min(ca.y,cb.y)-10};
  const T=reduced?200:(dragClone?420:560);
  const fly=(o,c)=>{ const dx=m.x-c.x, dy=m.y-c.y; return o.c.animate([
      {transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.1}px,${dy*.1-10}px) scale(1.08)`,offset:.2},
      {transform:`translate(${dx}px,${dy}px) scale(1.12)`,opacity:1,offset:.72},{transform:`translate(${dx}px,${dy}px) scale(.15) rotate(20deg)`,opacity:0}],
      {duration:T,easing:'cubic-bezier(.45,0,.25,1)'}).finished; };
  setTimeout(()=>thump(), T*.6);
  const lets=lettersForPair(idx).filter(i=>!g.revealed.has(i));
  setTimeout(()=>{ burst(m.x,m.y,g.combo); vib(18); if(g.combo>1) showCombo(g.combo);
    const note=THEME.n[idx%THEME.n.length]; (g.notes=g.notes||[]).push({t:Date.now(),note,combo:g.combo}); voice(note,0,.22); if(g.combo>1) voice(note+(g.combo>3?12:7),.07,.09); if(g.combo>2) voice(note-12,0,.08,2);
    lets.forEach((li,k)=>flyLetter(m, li, k*110)); setTimeout(updateHUD, 900); }, T*.72);
  await Promise.all([fly(A,ca),fly(B,cb)]); A.c.remove(); B.c.remove(); g.busy--; checkState(); }
function flyLetter(from, li, delay){ const to=letterXY(li); if(!to||reduced){ revealLetter(li,delay); return; }
  const n=document.createElement('div'); n.className='flynote'; n.textContent='✦'; n.style.left=from.x+'px'; n.style.top=from.y+'px'; $('#fx').appendChild(n);
  const dx=to.x-from.x, dy=to.y-from.y, g=S.game; g.revealed.add(li);
  n.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:`translate(calc(-50% + ${dx*.3}px),calc(-50% + ${dy*.3-50}px)) scale(1.3)`,opacity:1,offset:.35},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.5)`,opacity:.9}],{duration:650,delay,easing:'cubic-bezier(.4,0,.2,1)',fill:'backwards'}).onfinish=()=>{ n.remove(); if(S.game===g){ revealLetter(li); click(1800,.025); } }; }
function checkState(){ const g=S.game; if(g.over) return;
  if(present().length===0 && g.reserve.every(v=>!v)){ g.over=true; g.won=true; g.pauseAt=Date.now(); if(g.mode==='level'&&g.level===S.unlocked){ S.unlocked=g.level+1; g.newUnlock=true; } return celebrate(); }
  if(g.reserve.every(Boolean) && !hasMove()){ g.over=true; g.pauseAt=Date.now(); if(g.mode==='daily') S.dailyFailed='blocked'; setTimeout(()=>{ click(220,.08); S.sheet='blocked'; renderSheet(); },450); } }
async function celebrate(){ const g=S.game; await wait(700); if(S.game!==g) return; petals(); const tt=playTheme(); await wait(Math.min(tt*1000, 3500));

      <p class="fine">${L('No cal escriure accents, apòstrofs ni comes.')}</p>`); }
  if(S.sheet==='win'){ const tot=total(); const pos=g.mode==='daily'?Math.max(1,Math.round(tot/22)):null;
    if(g.mode==='daily') S.dailyDone={time:tot,pos};
    const med = pos&&pos<=10 ? medal('#E3AE3B','#1F6F5C','★') : medal('#1F6F5C','#E3AE3B','♪');
    const parts=[L('{0} de joc',fmt(elapsed()))]; if(g.attempts) parts.push(L('+ {0} min (intents)',g.attempts*2)); if(g.penalty) parts.push(L('+ {0} s (errors)',g.penalty)); if(g.hintPen) parts.push(L('+ {0} s (pistes)',g.hintPen)); if(g.bonus) parts.push(L('− {0} s (frase)',g.bonus));
    const rp = g.mode==='repte'&&S.challenge ? Math.floor(tot)-S.challenge.t : null;
    const next = g.mode==='repte' ? `<button class="btn primary" onclick="challenge()">${L('Retornar el repte')}</button>`
      : g.mode==='daily' ? `<button class="btn primary" onclick="S.sheet=null;go('class')">${L('Veure classificació')}</button>`
      : (groupOf(g.level+1)&&!groupOf(g.level+1).soon ? `<button class="btn primary" onclick="startLevel(${g.level+1})">${L('Nivell {0}',g.level+1)}${g.level%10===0?' · '+THEMES[groupOf(g.level+1).theme].name:''}</button>` : `<button class="btn primary" onclick="S.sheet=null;go('nivells')">${L('Tornar als nivells')}</button>`);
    return sheetWrap(`<div style="text-align:center"><div class="medalbig">${med}</div><h2 style="margin:6px 0 0">${rp===null?(g.solved?L('Frase resolta!'):L('Tauler resolt')):rp<0?L('Has guanyat el repte!'):rp===0?L('Empat exacte!'):L('Gairebé!')}</h2>
      <div class="bigtime" id="countup" data-to="${tot}">0:00</div>
      <p class="muted" style="margin:0">${parts.join(' ')}</p>
      ${rp!==null?`<div class="vs"><div class="${rp<=0?'win':''}"><small>${L('Tu')}</small><b>${fmt(tot)}</b></div><div class="${rp>0?'win':''}"><small>${L('Qui t’ha reptat')}</small><b>${fmt(S.challenge.t)}</b></div></div>
        <p style="font-weight:700;margin:4px 0">${rp<0?L('Per {0}. Ara li toca a l’altra persona.',fmt(-rp)):rp===0?L('Ni un segon de diferència.'):L('T’ha guanyat per {0}. Torna-li el repte!',fmt(rp))}</p>`:''}
      ${pos?`<p style="margin:8px 0 0"><span class="pill">${L('Posició {0} a la teva comarca',pos)}</span></p>`:''}
      ${g.newUnlock&&g.level%10===0?`<p style="margin:8px 0 0"><span class="pill">${L('Desbloquejats els nivells {0}–{1}!',g.level+1,g.level+10)}</span></p>`:''}</div>
      <div class="meaning" style="margin-top:14px"><q class="ph">${esc(g.phrase)}</q>${meaningOf(g.phrase)?`<span class="mn">${esc(meaningOf(g.phrase))}</span>`:''}
        ${g.solved&&g.newPhrase?`<span class="new">${L('Nou al teu refranyer · {0} de {1}',S.found,PHRASES.length)}</span>`:''}</div>
      ${(g.notes||[]).length?`<button class="listenbtn" onclick="playMine()" aria-label="${L('Escolta la teva melodia')}"><span class="playbtn">${ICON.play}</span><span style="flex:1;min-width:0"><b>${L('Escolta la teva melodia')}</b>${melHTML()}</span></button>`:''}
      <div class="stack">${next}
      ${g.mode!=='repte'?`<button class="btn gold" onclick="challenge()">${L('Compartir i reptar')}</button>`:''}
      <button class="btn secondary" onclick="S.sheet=null;go('avui')">${L('Tornar a l’inici')}</button></div>`); }
  return ''; }
function renderSheet(){ $('#sheet').innerHTML = S.sheet ? vSheet() : ''; if(S.tab==='joc'&&S.game&&$('#solveBtn')) updateHUD(); if(S.sheet&&S.sheet!=='solve'){ const f=$('#sheet .sheet button'); if(f) f.focus({preventScroll:true}); } const ph=$('#phone'); ph.scrollTop=0; ph.scrollLeft=0; const bw=$('#boardwrap'); if(bw&&!S.sheet){ bw.scrollLeft=Math.max(0,(bw.scrollWidth-bw.clientWidth)/2); }
  const cu=$('#countup'); if(cu){ const to=+cu.dataset.to, t0=performance.now(), d=reduced?1:1200;
    const tick=now=>{ const k=Math.min(1,(now-t0)/d), e=1-Math.pow(1-k,3); cu.textContent=fmt(to*e); if(k<1) requestAnimationFrame(tick); else { bell(14,0,.15,1.6); bell(21,.1,.12,1.6); bell(26,.2,.12,2.2);} };
    requestAnimationFrame(tick); } }
function shareGrid(){ const g=S.game, n=Math.min(5,Math.ceil(elapsed()/60)); return '🟩'.repeat(Math.max(1,6-n))+'🟨'.repeat(Math.min(5,n))+(g.attempts?' '+'🟥'.repeat(g.attempts):'')+(g.hints?' '+'💡'.repeat(Math.min(5,g.hints)):''); }

// ================= repte: el mateix tauler per a una altra persona =================
function challengeURL(){ const g=S.game, u=new URL(location.href.split('#')[0]); ['repte','tema','p','t','lang','prova'].forEach(k=>u.searchParams.delete(k));
  u.searchParams.set('repte',g.seedStr); u.searchParams.set('tema',g.theme); u.searchParams.set('p',g.nPairs); u.searchParams.set('t',Math.floor(total())); return u.toString(); }
async function challenge(){ const g=S.game, url=challengeURL(), txt=`Melodia · ${g.mode==='daily'?todayLabel:g.title}\n${shareGrid()}\n`+L('He fet {0} en aquest tauler. Em guanyes?',fmt(total()));
  if(navigator.share){ try{ await navigator.share({title:'Melodia', text:txt, url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(txt+'\n'+url); toast(L('Enllaç del repte copiat')); }catch(e){ toast(L('No s’ha pogut copiar')); } }
function readChallenge(){ const q=new URLSearchParams(location.search), seed=q.get('repte'), th=q.get('tema'), p=+q.get('p'), t=+q.get('t');
  if(!seed||!/^[\w-]{1,40}$/.test(seed)||!THEMES[th]||!(p>=12&&p<=40)||!(t>=0&&t<36000)) return null;
  try{ ['repte','tema','p','t'].forEach(k=>q.delete(k)); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')); }catch(e){}
  return {seed, theme:th, p:Math.round(p), t:Math.round(t)}; }
function acceptChallenge(){ const c=S.challenge; startGame('repte',c.theme,c.seed,L('Repte'),'',c.p); }
// ================= accions =================
function go(t){ if(S.tab==='joc'&&S.game&&!S.game.over&&!S.game.pauseAt) S.game.pauseAt=Date.now(); S.tab=t; S.sheet=null; render(); }
function playDaily(){ const g=S.game;
  if(g&&g.mode==='daily'&&g.seedStr===todaySeed&&!g.over){ S.tab='joc'; render(); resume(); return; }
  if(g&&g.mode==='daily'&&g.over&&present().length>0){ S.tab='joc'; render(); S.sheet='blocked'; renderSheet(); return; }
  startGame('daily','trad',todaySeed,L('Partida diària'),todayLabel,28); S.game.attempts=S.dailyAtt||0;
  if(S.dailyFailed){ const n=S.game; n.over=true; n.pauseAt=Date.now(); n.failReason=S.dailyFailed; updateHUD(); S.sheet='blocked'; renderSheet(); } }
const PALS=[['cap',L('Capvespre')],['lla',L('Llacuna')],['nit',L('Nit serena')]];
function cyclePal(){ const i=PALS.findIndex(p=>p[0]===S.set.pal); const n=PALS[(i+1)%PALS.length]; S.set.pal=n[0]; $('#phone').className=$('#phone').className.replace(/pal-\w+/,'pal-'+n[0]); toast(L('Colors')+': '+n[1]); }
function pause(){ const g=S.game; if(g.over){ if(!g.won){ S.sheet='blocked'; renderSheet(); } return; } if(!g.pauseAt) g.pauseAt=Date.now(); S.sheet='pause'; renderSheet(); }
// 11. Si l'app passa a segon pla (trucada, enquesta…), es posa en pausa
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.tab==='joc'&&S.game&&!S.game.over&&!S.game.pauseAt&&!S.sheet) pause(); });
function resume(){ const g=S.game; if(g&&g.pauseAt&&!g.over){ g.paused+=Date.now()-g.pauseAt; g.pauseAt=null; } S.sheet=null; renderSheet(); }
function closeSheet(){ if(S.sheet==='solve'){ if(!S.game.over) closeSolve(); return; } if(S.sheet==='pause'||S.sheet==='help') return resume(); if(S.sheet==='win') return; S.sheet=null; renderSheet(); }
function quit(){ S.sheet=null; renderSheet(); S.tab='avui'; render(); }
function buy(k){ if(k==='pass') S.pass=true; else S.plus=true; toast(k==='pass'?L('Passi del dia activat (simulat)'):L('Plus activat (simulat)'));
  S.sheet=null; renderSheet(); if(S.tab==='joc'&&S.game&&S.game.over&&present().length>0) restartSame(); else render(); }
function playYesterday(el){ el.parentElement.querySelector('.ans').innerHTML='<b style="font-family:var(--serif);font-size:18px;color:var(--ink)">«'+esc(pickPhrase(yesterdaySeed))+'»</b>'; el.remove(); }
let toastT; function toast(m){ clearTimeout(toastT); document.querySelectorAll('.toast').forEach(e=>e.remove()); const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.setAttribute('aria-live','polite'); d.textContent=m; $('#phone').appendChild(d); toastT=setTimeout(()=>d.remove(),2000); }

function render(){ const ph=$('#phone');
  ph.className='phone pal-'+S.set.pal+(S.set.size!=='normal'?' size-'+S.set.size:'')+(S.set.hc?' hc':'')+(S.set.dark?' dark':'')+(S.set.left?' left':'');
  if(S.tab==='joc'){ $('#view').innerHTML=vJoc(); mountGame(); }
  else { const ph=$('#phone'); ['--tw','--th','--sym'].forEach(v=>ph.style.removeProperty(v)); $('#view').innerHTML={avui:vAvui,nivells:vNivells,class:vClass,perfil:vPerfil}[S.tab](); }
  renderSheet(); }
setInterval(()=>{ if(S.tab==='joc'&&S.game&&!S.game.pauseAt) updateHUD(); },500);

// splash
function splash(){ const d=document.createElement('div'); d.className='splash herobg';
  d.innerHTML=`<div class="tiles3">${stackTiles(['b1','r1','d1'],50,66,[[8,12,-14],[55,0,0],[102,12,14]])}</div><div class="word">Melodia</div><div class="tag">${L('Fusiona fitxes · destapa la frase')}</div>`;
  $('#phone').appendChild(d);
  if(!reduced) d.querySelectorAll('.tile').forEach((t,i)=>t.animate([{transform:t.style.transform+' translateY(-80px)',opacity:0},{transform:t.style.transform,opacity:1}],{duration:600,delay:i*140,easing:'cubic-bezier(.34,1.5,.64,1)',fill:'backwards'}));
  const close=()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(),500); }; d.onclick=close; setTimeout(close, reduced?300:2200); }
S.challenge=readChallenge(); render(); splash(); if(S.challenge) setTimeout(()=>{ if(S.tab!=='joc'&&!S.sheet){ S.sheet='repte'; renderSheet(); } }, reduced?350:2300);
</script>
<!-- Mode prova amb usuaris: index.html?prova=1&lang=ca|es mostra una barra amb l'enllaç a l'enquesta -->
<script src="prova-config.js"></script>
<script>
(function(){
  "use strict";
  const TX = {
    ca: { label: "Prova de Melodia", cta: "Respondre l'enquesta", soon: "L'enquesta encara no està a punt", ask: "Has acabat de provar el joc? Ara obrirem l'enquesta (uns 8 minuts)." },
    es: { label: "Prueba de Melodia", cta: "Responder la encuesta", soon: "La encuesta todavía no está lista", ask: "¿Has terminado de probar el juego? Ahora abriremos la encuesta (unos 8 minutos)." },
    en: { label: "Melodia test", cta: "Answer the survey", soon: "The survey isn't ready yet", ask: "Have you finished trying the game? We'll now open the survey (about 8 minutes)." }
  };
  // Idioma: el que passa la pàgina d'instruccions; si no, el primer idioma del telèfon que tinguem; si cap, anglès.
  const sysLang = () => { for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])) { const c = String(l).toLowerCase().slice(0, 2); if (TX[c]) return c; } return "en"; };
  let q = new URLSearchParams(location.search), on = q.get("prova") === "1", lang = q.get("lang");
  if(!TX[lang]) lang = sysLang();
  try {
    if(on) sessionStorage.setItem("melodia-prova", lang);
    else { const s = sessionStorage.getItem("melodia-prova"); if(s){ on = true; lang = TX[s] ? s : sysLang(); } }
  } catch(e) {}
  if(!on) return;
  const T = TX[lang];
  const url = (window.MELODIA_ENQUESTA || {})[lang] || "";
  const css = document.createElement("style");
  css.textContent = "body.prova{flex-direction:column}" +
    ".provabar{flex:0 0 auto;width:100%;max-width:400px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;background:#1F2328;color:#fff;font-size:14px;line-height:1.2}" +
    ".provabar a,.provabar span.off{flex:0 0 auto;background:#E9B949;color:#2A1F05;font-weight:700;text-decoration:none;border-radius:999px;padding:8px 14px;min-height:36px;display:flex;align-items:center}" +
    ".provabar span.off{background:#5B5F66;color:#fff;font-weight:400}" +
    "body.prova .phone{height:calc(100% - 48px)}" +
    "@media (min-width:500px){.provabar{border-radius:14px;margin-bottom:10px}body.prova .phone{height:min(860px,calc(100% - 64px))}}";
  document.head.appendChild(css);
  const bar = document.createElement("div");
  bar.className = "provabar";
  const lbl = document.createElement("span"); lbl.textContent = T.label; bar.appendChild(lbl);
  if(url){
    const a = document.createElement("a"); a.href = url; a.textContent = T.cta + " →"; a.rel = "noopener";
    a.addEventListener("click", ev => { if(!confirm(T.ask)) ev.preventDefault(); });
    bar.appendChild(a);
  } else {
    const s = document.createElement("span"); s.className = "off"; s.textContent = T.soon; bar.appendChild(s);
  }
  document.body.classList.add("prova");
  document.body.insertBefore(bar, document.getElementById("phone"));
})();
</script>
</body>
