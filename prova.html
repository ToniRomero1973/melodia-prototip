<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova Melodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="prova-config.js"></script>
<style>
:root{
  --bg:#F5F0E6; --surface:#FFFFFF; --ink:#1F2328; --quiet:#5B5F66; --line:#E6DDCD;
  --jade:#1F6F5C; --jade-d:#164F41; --jade-soft:#E2EFE9;
  --serif:"Fraunces", Georgia, serif;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191C1F; --surface:#24282C; --ink:#F1EEE8; --quiet:#B4B0A8; --line:#353A40; --jade:#3E9C83; --jade-d:#2A7563; --jade-soft:#1F3A33; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:18px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--jade)}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:15px;font-weight:700;border:0;background:transparent;color:var(--quiet);padding:6px 14px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--jade);color:#fff}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;margin:22px 0 8px}
h2{font-family:var(--serif);font-size:22px;margin:28px 0 10px}
p{margin:8px 0}
.muted{color:var(--quiet)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:14px 0}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.steps li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:50%;background:var(--jade-soft);color:var(--jade);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:1px}
.tasks{padding-left:22px;margin:0}
.tasks li{padding:5px 0}
.note{font-size:16px;background:var(--jade-soft);border-radius:14px;padding:12px 14px;margin:16px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:999px;background:var(--jade);color:#fff;font-size:19px;font-weight:700;text-decoration:none;box-shadow:0 4px 0 var(--jade-d);margin-top:22px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--jade-d)}
.small{font-size:15px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Melodia</div>
    <div class="lang" role="group" aria-label="Idioma">
      <button type="button" data-lang="ca" aria-pressed="true" title="Català">CA</button>
      <button type="button" data-lang="es" aria-pressed="false" title="Castellano">ES</button>
      <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
    </div>
  </div>

  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <p class="muted" data-t="intro2"></p>

  <div class="card">
    <h2 style="margin-top:4px" data-t="howTitle"></h2>
    <ol class="steps">
      <li data-t="step1"></li>
      <li data-t="step2"></li>
      <li data-t="step3"></li>
    </ol>
  </div>

  <h2 data-t="tryTitle"></h2>
  <p class="muted small" data-t="tryIntro"></p>
  <ol class="tasks">
    <li data-t="t1"></li><li data-t="t2"></li><li data-t="t3"></li>
    <li data-t="t4"></li><li data-t="t5"></li><li data-t="t6"></li>
    <li data-t="t7"></li><li data-t="t8"></li><li data-t="t9"></li>
    <li data-t="t10"></li><li data-t="t11"></li><li data-t="t12"></li>
  </ol>

  <p class="note" data-t="note"></p>

  <a class="btn" id="play" href="index.html?prova=1&amp;lang=ca" data-t="play"></a>
  <p class="muted small" style="text-align:center;margin-top:12px" data-t="mobile"></p>
</main>
<script>
"use strict";
const TXT = {
  ca: {
    title: "Ens ajudes a provar un joc?",
    intro: "Melodia és un joc de mahjong per al mòbil que encara està en fase d'esbós. Volem saber què s'entén, què agrada i què no.",
    intro2: "No t'avaluem a tu, sinó el joc: si alguna cosa no s'entén, és culpa del joc. El nom i els textos són provisionals.",
    howTitle: "Com funciona",
    step1: "Juga uns 10–15 minuts i prova les coses de la llista de sota, a poc a poc i sense pressa.",
    step2: "Quan hagis jugat una partida, a dalt de tot i a Perfil apareixerà «Respondre l'enquesta». La pots fer quan vulguis.",
    step3: "Respon l'enquesta: són uns 10 minuts i és anònima.",
    tryTitle: "Què has de provar",
    tryIntro: "No cal fer-ho en ordre. Si alguna cosa no et surt, no passa res: és el que volem saber.",
    t1: "Mira la pantalla d'inici: de què creus que va el joc?",
    t2: "Juga la partida del dia. Si no saps com, busca «Com es juga».",
    t3: "Fes servir el faristol (la safata on pots apartar fitxes).",
    t4: "Intenta endevinar la frase amagada.",
    t5: "Quan acabis la partida, mira la postal del dia i prova d'enviar-la.",
    t6: "Busca la classificació.",
    t7: "A Perfil, Ajustos: fes les fitxes més grans i canvia els colors.",
    t8: "Juga un nivell que no sigui el del dia.",
    t9: "Fes 3 errors expressament (arrossega fitxes damunt d'altres que no són la seva parella) i mira què passa.",
    t10: "Quan acabis una partida, intenta endevinar quina cançó sonava.",
    t11: "A Classificació, crea una lliga per a la teva gent (família, amics, escola…) i posa-la la primera.",
    t12: "Busca com regalaries el joc a un familiar (no es cobra res).",
    note: "És un prototip: no es cobra res i no cal registrar-se. Tot el que veuràs de pagaments és simulat.",
    play: "Començar a jugar",
    mobile: "Funciona millor al mòbil."
  },
  es: {
    title: "¿Nos ayudas a probar un juego?",
    intro: "Melodia es un juego de mahjong para el móvil que todavía está en fase de boceto. Queremos saber qué se entiende, qué gusta y qué no.",
    intro2: "No te evaluamos a ti, sino al juego: si algo no se entiende, es culpa del juego. El nombre y los textos son provisionales.",
    howTitle: "Cómo funciona",
    step1: "Juega unos 10–15 minutos y prueba las cosas de la lista de abajo, poco a poco y sin prisa.",
    step2: "Cuando hayas jugado una partida, arriba del todo y en Perfil aparecerá «Responder la encuesta». Puedes hacerla cuando quieras.",
    step3: "Responde la encuesta: son unos 10 minutos y es anónima.",
    tryTitle: "Qué tienes que probar",
    tryIntro: "No hace falta hacerlo en orden. Si algo no te sale, no pasa nada: es lo que queremos saber.",
    t1: "Mira la pantalla de inicio: ¿de qué crees que va el juego?",
    t2: "Juega la partida del día. Si no sabes cómo, busca «Cómo se juega».",
    t3: "Usa el atril (la bandeja donde puedes apartar fichas).",
    t4: "Intenta adivinar la frase oculta.",
    t5: "Cuando acabes la partida, mira la postal del día e intenta enviarla.",
    t6: "Busca la clasificación.",
    t7: "En Perfil, Ajustes: haz las fichas más grandes y cambia los colores.",
    t8: "Juega un nivel que no sea el del día.",
    t9: "Haz 3 errores a propósito (arrastra fichas encima de otras que no son su pareja) y mira qué pasa.",
    t10: "Cuando acabes una partida, intenta adivinar qué canción sonaba.",
    t11: "En Clasificación, crea una liga para tu gente (familia, amigos, cole…) y ponla la primera.",
    t12: "Busca cómo regalarías el juego a un familiar (no se cobra nada).",
    note: "Es un prototipo: no se cobra nada y no hace falta registrarse. Todo lo que veas de pagos es simulado.",
    play: "Empezar a jugar",
    mobile: "Funciona mejor en el móvil."
  },
  en: {
    title: "Will you help us test a game?",
    intro: "Melodia is a mahjong game for your phone that is still an early sketch. We want to know what makes sense, what you like and what you don't.",
    intro2: "We're testing the game, not you: if something is unclear, that's the game's fault. The name and texts are provisional.",
    howTitle: "How it works",
    step1: "Play for about 10–15 minutes and try the things on the list below, slowly and without rushing.",
    step2: "Once you've played a game, “Answer the survey” appears at the very top and in Profile. You can do it whenever you like.",
    step3: "Answer the survey: it takes about 10 minutes and it's anonymous.",
    tryTitle: "What to try",
    tryIntro: "You don't have to follow the order. If something doesn't work for you, that's fine: it's exactly what we want to learn.",
    t1: "Look at the home screen: what do you think the game is about?",
    t2: "Play today's game. If you're not sure how, look for “How to play”.",
    t3: "Use the rack (the tray where you can set tiles aside).",
    t4: "Try to guess the hidden phrase.",
    t5: "When you finish the game, look at today's postcard and try sending it.",
    t6: "Find the leaderboard.",
    t7: "In Profile, Settings: make the tiles bigger and change the colours.",
    t8: "Play a level other than today's game.",
    t9: "Make 3 mistakes on purpose (drag tiles onto others that aren't their pair) and see what happens.",
    t10: "When you finish a game, try to guess which song was playing.",
    t11: "In Leaderboard, create a league for your people (family, friends, school…) and move it to the top.",
    t12: "Find how you would give the game to a family member (nothing is charged).",
    note: "This is a prototype: nothing is charged and you don't need to sign up. Any payments you see are simulated.",
    play: "Start playing",
    mobile: "Works best on a phone."
  }
};
// Idioma del telèfon: el primer de la llista del sistema que tinguem; si cap, anglès.
function systemLang(){
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
  for (const l of list){ const c = String(l).toLowerCase().slice(0, 2); if (TXT[c]) return c; }
  return "en";
}
function setLang(l){
  if(!TXT[l]) l = "ca";
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = TXT[l][el.dataset.t] || ""; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  document.getElementById("play").href = "index.html?prova=1&lang=" + l;
  document.title = { ca: "Prova Melodia", es: "Prueba Melodia", en: "Test Melodia" }[l];
  document.querySelector(".lang").setAttribute("aria-label", { ca: "Idioma", es: "Idioma", en: "Language" }[l]);
}
// El participant pot canviar l'idioma a mà; la tria es recorda en aquest navegador.
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  setLang(b.dataset.lang);
  try { localStorage.setItem("melodia-prova-lang", b.dataset.lang); } catch(e) {}
}));
let start = new URLSearchParams(location.search).get("lang");
if(!TXT[start]){ try { start = localStorage.getItem("melodia-prova-lang"); } catch(e) { start = null; } }
if(!TXT[start]) start = systemLang();
setLang(start);
</script>
</body>
</html>
